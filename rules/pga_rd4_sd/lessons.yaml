  - id: pga-rd4-sd-2026-06-19-contention-extends-past-54hole-leaders
    born: "2026-06-19"   # RBC Canadian Open R4 SD
    origin: "autopsies.md — PGA RD4 SD RBC Canada 2026 (the -9/3-back chasers, faded as 'not T-10 starters', were the slate-definers)"
    statement: >
      On RD4 SD, final-round contention extends well past the 54-hole leaders, and a
      hard position gate that fades golfers 2-4 shots back ('not a T-10 starter') is a
      ceiling leak — those chasers carry full ceiling, are usually lower-owned than the
      leaders, and are exactly who wins when Sunday scoring reopens. Distinguish three
      buckets, do NOT collapse the back two into one: (1) leaders/T-10 = chalk;
      (2) IN-CONTENTION chasers 2-4 back (here -9, 3 back) = full ceiling, the real
      leverage tier; (3) WAY-BACK darts (>6-7 back / over par) = can't post the needed
      round on a tough course, the only bucket the position gate should actually
      exclude. The 'birdie hedge = way-back sub-5% lottery tickets' construction is its
      own leak: hedge the reopened-scoring world with bucket-2 chasers, not bucket-3
      darts; reserve true way-back darts for confirmed -19/-20 birdie-fests only.
    status: codified
    confirmations:
      - date: "2026-06-19"
        slate: "PGA RD4 SD RBC Canada 2026 (rules/pga_rd4_sd/history/2026-06-19__pga-rd4-sd-rbc-canada-2026)"
        note: >
          BORN here. Winning lineup = Fitzpatrick (-9 T12, scored 65.4) + Hovland (-9 T12) + Cauley +
          Fox + Taylor Moore + Keita Nakajima; Fitzpatrick was THE slate-definer (67.4% of top
          lineups, 15.55% own). The analysis rated Fitzpatrick MIX-down and PASSED Hovland explicitly
          because they were -9, not -10-or-better; the user rostered NEITHER across all 6 lineups.
          Sunday scoring reopened (Fitz/Hovland fired low rounds from 3 back). Meanwhile the user's
          two birdie hedges bet on bucket-3 way-back darts (Thorbjornsen -4, Tom Kim -6, McGreevy -6,
          Bezuidenhout -4) that did not deliver. Best user finish (L3, 4.5 pct) carried Cauley but no
          bucket-2 chaser -> ceiling capped. The position gate, reinforced by the red team's
          'all-in-the-red, exclude way-back' framing, faded the exact tier that won.
      - date: "2026-08-08"
        slate: "Rocket Classic 2026 RD4 SD (rules/pga_rd4_sd/history/2026-08-08__rocket-classic-2026-rd4-sd)"
        note: >
          Both halves of the three-bucket mechanism confirmed. Bucket 2 (in contention,
          just outside the top 10): Matt Wallace, T-11 start at 12.65% SE own, was the
          SE slate-definer (52.8, in 35% of top lineups) and made the mini-MAX winning
          lineup. Bucket 3 (way back): J.J. Spaun, T-48 start and the article's own
          contrarian call, scored 22.8 and was a pure fish trap (14.1% of mini-MAX
          fish, 0% of winners). Meanwhile the 54-hole T-2 chalk (Brennan, 30-37% own)
          busted at 27.4. Contention extended past the leaders exactly as stated, and
          the bucket the gate should exclude is the one that busted. Promoted
          hypothesis -> validated; meets the 3-confirming-slate bar — codification
          proposed 2026-08-08. Caveat: exact stroke deficits weren't in the standings,
          so position (T-11 vs T-48) proxied the 2-4-back vs way-back split.
      - date: "2026-08-11"
        slate: "Wyndham Championship RD4 SD 2026 (rules/pga_rd4_sd/history/2026-08-11__wyndham-championship-rd4-sd-2026)"
        note: >
          Bucket-2 chaser Justin Thomas ($9,500, 15.2% proj / 10.6-13.3% actual own,
          outside the lead group) scored 55.9 and sat in BOTH contest-winning lineups;
          chaser Hideki (18.5% proj) scored 60.0 and anchored 4 of the SE top 10.
          Meanwhile leaderboard chalk Tom Kim (44-47% field own) busted at 39.05.
          Contention extended past the 54-hole leaders exactly as codified.
    contradictions: []
    codified_in: "framework.md — The Three-Bucket Position Read (codified 2026-08-08, under Rule-Set Decision Framework)"
    retired_reason: null

  - id: pga-rd4-sd-2026-08-08-single-bullet-gets-envelope-not-darts
    born: "2026-08-08"   # Rocket Classic 2026 RD4 SD
    origin: "rules/pga_rd4_sd/history/2026-08-08__rocket-classic-2026-rd4-sd — shark_gap.json + adherence.json (SE contest 193066355)"
    statement: >
      Contrarian dose must scale WITH bullet count, and the build did the opposite:
      the 34-entry set sat near the format envelope (14.85% avg per-slot own) while
      the lone single-entry bullet — the home game — was built at 7.28% own with 5
      sub-10% golfers, zero exposure to all three chalk anchors, and zeroed two of the
      strategy's own UNDERWEIGHT calls (Thorbjornsen 74.75, the slate's top score;
      Rasmus 47.85, in the SE winner). Mechanism: with one bullet there is no
      portfolio to hold the modal outcome, so the single entry itself must be the
      modal-shape bet (~19-23% per-slot own, 1-2 sub-10% pieces — SE winners ran
      20.5%/1.85, the tracked pro moklovin 22.9%); darts belong in the multi-entry
      set. Corollary: an UNDERWEIGHT call in a 1-entry contest can only execute as 0%
      or 100%, and defaulting to 0% silently converts "own less" into "punch out" —
      in a single bullet, underweight means the golfer must still be considered
      must-appear unless explicitly full-faded. Recurring axis: shark-gap own_per_slot
      has now separated in this same direction on both graded RD4 SD slates
      (6/19 Fitzpatrick-to-zero; 8/8 delta -15.6).
    status: validated
    confirmations:
      - date: "2026-08-11"
        slate: "Wyndham Championship RD4 SD 2026 (rules/pga_rd4_sd/history/2026-08-11__wyndham-championship-rd4-sd-2026)"
        note: >
          First live confirmation, from the corrective side. Both single-entry bullets
          were built at the envelope the lesson prescribes — 22.2% and 22.8% avg
          per-slot own with exactly 1 sub-10% piece each (vs 8/8's 7.28% own / 5
          darts) — and produced rank 1 of 294 (WON the contest) and 19 of 141. The
          recurring shark-gap own-per-slot delta narrowed from -15.6 to -5.6, and the
          user beat the lone tracked shark in-field (their 0.34 pctile vs the shark's
          77.9). Envelope-shaped single bullets captured the modal outcome exactly as
          the mechanism states. 2 of 3 slates toward promotion.
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: pga-rd4-sd-2026-08-11-own-outrunning-projection-trap-shape
    born: "2026-08-11"   # Wyndham Championship RD4 SD 2026
    origin: "rules/pga_rd4_sd/history/2026-08-11__wyndham-championship-rd4-sd-2026 — field_profile.fish_traps + actual-vs-projected ownership, both contests"
    statement: >
      On RD4 SD, the trap SHAPE is actual lock ownership running far ahead of the
      printed projection-own number. This slate the losing half's signature buys all
      shared it: Van Rooyen 5.6% projected -> 12-20% actual (scored 8.2, a top-2 fish
      trap in both contests), Koivun 11.2% -> 18-25% actual (27.6), Thompson 24.6% ->
      32-36% actual (30.6) — all three at 0% of winners. Winners' rosters were built
      from golfers at or below their printed number (James 10.5% -> 6-8%, JT 15.2% ->
      11-13%). Mechanism: ownership drifts late toward comfort/leaderboard names after
      the sheet prints, so the field pays a worse leverage price than the printed
      number shows, while plays that hold or undershoot their number keep their
      leverage for free. Pre-lock implication: treat a popular name's printed own as a
      FLOOR, and prize plays whose ownership has no obvious reason to drift up.
      Consistent with the trap-is-a-price doctrine — this is a price condition, never
      a player list.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: pga-rd4-sd-2026-08-08-sim-winpct-weak-ranking-signal
