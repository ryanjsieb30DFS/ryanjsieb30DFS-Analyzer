    statement: >
      The Sim's pre-lock Win% metric may be a threshold, not a ranking: its Spearman
      correlation with actual lineup score was ~0 in BOTH contests this slate (0.133
      in the 245-field SE, 0.067 in the 7,134-field mini-MAX) while Top-1%, ROI, and
      Cash% all landed 0.34-0.43 with top-100-by-metric outscoring the pool average by
      ~25-28 points. Mechanism guess: Win% concentrates on a tiny tail outcome, so its
      ordering within a 10,500-lineup pool is dominated by noise even when the
      coarser metrics rank usefully. One slate is noise — needs a second archived
      sim_autopsy showing the same near-zero Win% before treating it as a
      tool-calibration rule (rank/filter by ROI/Top-1%/Cash%, use Win% only as a
      floor gate).
    status: hypothesis
