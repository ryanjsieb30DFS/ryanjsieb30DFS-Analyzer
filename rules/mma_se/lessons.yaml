  - id: mma-se-2026-07-19-exact-roster-duplication-is-superlinear-in-consensus
    born: "2026-07-19"
    origin: "rules/mma_se/history/2026-07-19__ufc-oklahoma-city-7-18-26 (third-pass review, 2026-07-26)"
    statement: >
      In a top-heavy SE, the number that decides what a hit is WORTH is exact-roster
      duplication, and it rises far faster than per-player ownership does — so the
      pre-lock check must be run on the whole six-man roster, not slot by slot.
      Evidence (7/19 OKC, 784-entry Flying Knee, $2K to 1st): the user's rank-18 roster
      was entered 10 times (`dup_count` 10; it is the #3 exact-roster dupe magnet in the
      field at count 9), while the WINNING roster was entered twice. The two rosters
      differ by exactly ONE fighter — Bashi (47.3% actual own) vs RJ Harris (29.1%).
      Naive independence says that swap should cut expected duplicates only ~1.6x
      (1.93 -> 1.19 on the ownership product x 784; the tool's own `expected_dupes`
      returns 1.19 for the winner, matching), yet ACTUAL duplication fell ~5x (10 -> 2).
      Mechanism: entrants converge on the consensus roster, so duplication concentrates
      SUPER-linearly on whichever pieces the field agrees about — the user's build ran
      ~5.2x its independence estimate and the winner's ~1.7x. Consequence the ownership
      view hides: even had Bashi won, first prize splits ten ways, so a top-heavy SE
      bullet built entirely from consensus pieces is capped in VALUE before the fights
      start, independent of score. Note the two edges pointed the same way here — the
      swap that raised the score (Bashi 42.90 -> Harris 106.70) is the same swap that
      cut duplication 5x — which is why the mid-own converter screen and the duplication
      check are not competing constraints. Rule to test: before locking a top-heavy SE,
      compute the roster's ownership product x field size and multiply by the sport's
      measured concentration factor (MMA 1.7-6.6x per the Sim corpus), and treat a
      double-digit expected-dupe count as a build-defining flag, not a footnote — the
      Grade tab's `crowded_pair` flag fired on Bashi+McMillen pre-lock and was
      overridden. Links [[mma-se-2026-07-19-winning-se-shape-six-winners-mid-own-converters]],
      [[mma-se-2026-07-19-projected-own-understates-consensus-chalk-convergence]],
      [[mma-se-2026-05-16-no-identical-conviction-cores]].
    status: codified
    confirmations:
      - date: "2026-08-09"
        slate: "UFC Fight Night: Gamrot vs. Salkilld 8.8.26 — 784 SE"
        origin_dir: "rules/mma_se/history/2026-08-09__ufc-fight-night-gamrot-vs-salkilld-8-8-26"
        note: >
          First confirmation -> promoted to validated. The value-cap half realized
          exactly: the SE field's most-duplicated competitive roster — the all-consensus
          Salkilld/Nurgozhay/Quarantillo/Montanha/Thainara/T.Miller build at 42.2% avg
          own — was entered 11 times, HIT (614.06 points), and finished rank 8 with the
          prize split eleven ways. Naive independence on those six ownerships predicts
