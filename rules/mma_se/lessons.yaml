  # ---- 2026-08-02 — UFC Fight Night 283, Belgrade (Medić vs. Rodriguez) ----

  - id: mma-se-2026-08-02-okay-tier-is-a-dumping-ground
    born: "2026-08-02"
    origin: "rules/mma_se/history/2026-08-02__ufc-fight-night-283-medi-vs-rodriguez-8-1-26"
    statement: >
      The player pool's `Okay` tier is absorbing the fighters the board cannot separate,
      which turns the fat middle of the ranking into noise exactly where the slate is
      decided. On 8/2 the board put 15 of 28 rosterable fighters (54%) into `Okay`, and
      that single bucket contained FOUR of the slate's ten highest scores — Bogdan Grad
      120.12 (the #3 score, in the 588-field winner), Stephanie Luciano 104.18, Jovan
      Leka 104.06 and Tofiq Musayev 102.86 (in BOTH winners) — alongside the slate's
      worst busts (Rodriguez 0.4, Blachowicz 1.9, Prepolec 2.6, Cowan 5.2). A tier whose
      members range from 0.4 to 120.1 points carries no information. The measured
      consequence is that `Okay` averaged 41.4 while `Fade` averaged 43.4, so tier
      ordering came back OUT OF ORDER for the second consecutive graded slate (7/26 broke
      at Core-vs-Good, 8/2 at Okay-vs-Fade). Mechanism: `Core` and `Good` require a
      positive case and `Fade` requires a negative one, so every fighter the board is
      merely uncertain about defaults into `Okay` — the tier is defined by the absence of
      a verdict rather than by a property, and uncertainty is highest precisely among the
      mid-priced converters that decide MMA SE slates. Rule to test: hold `Okay` to no
      more than about a third of the board and force the remainder into `Good` or `Fade`
      with a stated one-line reason, so that being in the middle is a verdict rather than
      a shrug. Watch the tier-ordering flag in `pool_calibration.json` as the read-out.
      Links [[mma-se-2026-06-20-finish-capable-favorite-is-not-secondary-chalk]],
      [[mma-se-2026-07-19-winning-se-shape-six-winners-mid-own-converters]].
    status: codified
    confirmations:
      - date: "2026-08-09"
        slate: "UFC Fight Night: Gamrot vs. Salkilld 8.8.26"
        origin_dir: "rules/mma_se/history/2026-08-09__ufc-fight-night-gamrot-vs-salkilld-8-8-26"
        note: >
