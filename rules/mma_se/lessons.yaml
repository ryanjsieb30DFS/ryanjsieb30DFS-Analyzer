  - id: mma-se-2026-08-23-core-tier-mirrors-the-field-chalk
    born: "2026-08-23"
    origin: "rules/mma_se/history/2026-08-23__ufc-fight-night-hernandez-vs-rodrigues-8-22-26"
    statement: >
      The player pool's `Core` tier is being assigned from projection plus narrative
      consensus — the same two signals that set public ownership — so on MMA cards it
      converges on the field's chalk anchors instead of on the fighters most likely to
      out-score their price, and a tier that mirrors ownership carries no independent
      information. On 8/23 the board named exactly two Core fighters and they were the
      slate's two most-owned expensive names: Anthony Hernandez ($8,600, 56% projected
      / 56.9% actual, proj 82.7) and Lerryan Douglas ($9,300, 38% / 33.5%, proj 83.9).
      Both failed — Hernandez 74.4 in a loss, Douglas 5.6 — and `Core` averaged 40.0
      points against `Good`'s 120.1, dragging tier ordering OUT OF ORDER for the fifth
      straight graded slate, this time at the Core-vs-Good seam. The field's own data
      says the same thing louder: `field_analysis` scored Hernandez the slate's #1 fish
      trap, in 67.0% of the bottom-half lineups and 7.1% of the winners. The user's five
      entries carried ZERO Core fighters and finished 0.2 / 1.3 / 1.9 / 4.4 / 14.0
      percentile. Mechanism: `Core` is meant to answer "build around this," but the
      evidence it is built from — highest projection, most article ink, main-event
      billing — is the evidence the crowd uses, so Core reproduces the chalk it should
      be pricing against. `Good` and `Okay`, where the board must argue a case, are
      where the converters land. Rule to test: a fighter may only be tiered `Core` when
      his case survives a projected-ownership check — if his projected own is already
      top-3 on the board, he needs an edge the crowd is NOT paying for (a price
      dislocation, an unowned twin, a scoring path that pays without a finish), or he
      belongs in `Good`. Watch the Core-vs-Good seam in `pool_calibration.json` as the
      read-out. Links [[mma-se-2026-08-02-okay-tier-is-a-dumping-ground]],
      [[mma-se-2026-07-19-winning-se-shape-six-winners-mid-own-converters]],
      [[mma-se-2026-05-30-anchor-equivalence-fifth-validation]].
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: mma-se-2026-08-23-underweight-gate-deletes-a-whole-pool-branch
    born: "2026-08-23"
    origin: "rules/mma_se/history/2026-08-23__ufc-fight-night-hernandez-vs-rodrigues-8-22-26"
    statement: >
      The strategy gate implements an UNDERWEIGHT verdict as an absolute exclusion, so
      on a one- or two-bullet contest a single soft, probabilistic call silently deletes
      every pool lineup containing that fighter — and one wrong soft call can delete the
      winning branch. Evidence: the strategy called Chris Padilla UNDERWEIGHT ($8,000,
      34% projected own, 62.0 projection, "the fight is -190 to go the distance").
      `strategy_gate` therefore removed every Padilla lineup from all three contests'
      candidate slices, and the Clinch pick's own note says so plainly — it chose the
      best row "that carries none of the six prices the strategy flagged as picked ahead
      of their projected points." Padilla drew 44.6-49.7% ACTUAL own and scored 111.35,
      and he was in the winning lineup of TWO of the three contests (mbhall3 702.21 in
      the 784 Flying Knee; kpro790 720.92 in the 1,426 Clinch). The Sim's 6,500-lineup
      pool held a lineup scoring 720.92 — exactly the Clinch winning score — and the
      gate could never have picked it. The near-miss confirms the shape: the user
      finished rank 3 by 16.4 points, and BOTH proposed repairs were Padilla (best swap
      Dyer -> Padilla +3.8; the points-best swap Dorsainvil -> Padilla +17.5 was blocked
      $100 over the cap). Mechanism: FADE and LEAN FADE are absolute claims and belong
      as hard exclusions, but UNDERWEIGHT means "less than the crowd, never zero" — the
      strategy's own definition — and collapsing it to zero on a single-entry slate
      converts a 60/40 read into a 100/0 ban. The cost is asymmetric: the call being
      right saves a few points of ownership, the call being wrong removes the winner.
      Rule to test: the gate should treat `underweight` as a soft rule that is dropped
      FIRST when it excludes a high-sim-rank branch of the pool, and the digest should
      report how many lineups each verdict removes so the price of a soft call is
      visible before the pick. Note the ledger tension logged honestly — the gate is
      also what kept the entries off Hernandez, the slate's #1 fish trap, so the fix is
      to grade FADE and UNDERWEIGHT differently, not to weaken the gate. Links
      [[mma-se-2026-06-20-fade-on-structure-not-narrative]],
      [[mma-se-2026-07-12-distance-fight-is-not-low-ceiling]],
      [[mma-se-2026-08-16-abbreviated-names-drop-contract-calls]].
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null
  - id: mma-se-2026-08-23-salary-buys-floor-not-ceiling
    born: 2026-08-23
    origin: rules/mma_se/history/2026-08-23__ufc-fight-night-hernandez-vs-rodrigues-8-22-26
    statement: >
      DK MMA salary buys EXPECTED points and sells WIN-CASE points, and the trade is
      visible on the vendor sheet BEFORE lock — no result needed. Measured across 19
      MMA cards and 474 fighters using only projections and win probability, the bands
      are monotonic in both directions on 19 OF 19 CARDS, no exceptions: $9,000+
      averaged 10.58 win-case points per $1K and 8.76 EXPECTED points per $1K;
      $7,500-8,999 averaged 11.55 and 7.32; under $7,500 averaged 13.63 and 5.47. That
      consistency makes it a property of how DailyFan prices MMA, not a slate quirk.
      Expected points is the CASH measure — it averages in the worlds where the fighter
      loses, and the user is never paid in those. Win-case per dollar is the GPP
      measure. Mechanism: MMA scoring is finish-driven, not quality-driven, so a
      fighter's win-case score barely rises with price while his price rises with his
      win PROBABILITY. REALIZED results confirm it across 15 cards and 192 winners
      (winners only): average points move barely at all across a $3,000+ price range —
      103.7 ($9,000+, n=71), 101.6 ($7,500-8,999, n=96), 94.1 (under $7,500, n=25) — so
      points PER DOLLAR falls monotonically as price rises: 11.09, 12.26, 13.22,
      tracking the ex-ante win-case column almost exactly. Survivorship caveat stated
      honestly: expensive fighters win more often, so the realized rows measure points
      GIVEN a win, never expected value. The 8/23 case makes the inversion concrete and
      is entirely ex ante: of the seven fighters the user rostered, Shanelle Dyer ranked
      FIRST on expected points per dollar (9.15) and LAST on win-case per dollar
      (10.04). She cost $9,700 with a 97.4 win case; Gregory Rodrigues cost $7,600 with
      a 106.8 win case — in the world where both win the cheaper fighter pays more, and
      Dyer's only edge was winning more often. She was in 100% of five entries. Realized
      numbers agree without being needed: 107.52 points (11.08 per $1K), NOT in the
      optimal lineup (732.1 = Padilla/Rodrigues/McVey/Emmers/Mederos/de Ridder), and in
      only 21 of the top 100 possible lineups. The Anchor-Equivalence call that took
      Dyer over Wint and Barbosa at the same win probability and half the ownership was
      CORRECT WITHIN THAT TIER — the error was shopping in the tier at all, then putting
      one $9,700 floor-buy in every entry. Rule to test: require a stated FINISH path
      (not merely a win path) for every $9,000+ slot; source win-probability from the
      $7,500-8,999 tier; carry 1-2 fighters at $9,000+ and rarely more; never run the
      same expensive favorite in 100% of a multi-entry set. The sub-$7,500 tier is NOT
      the automatic answer: best ceiling per dollar, worst expected value (5.47), and
      the fewest absolute points among winners (94.1) — it is where the ceiling lives
      and where the dead slots live, so the cheap-slot rule still governs it.
      TWO METHOD CORRECTIONS, both from the user's challenges and both load-bearing.
      (1) HINDSIGHT GUARD: exposure is judged against what the SHEET showed, never
      against how often a fighter turned up in the realized top 100. Rodrigues was a 34%
      dog — in the two-thirds of worlds where he loses he is in none of the top lineups
      — so "he was in 100% of the top 100" describes what happened and was never a
      pre-lock target. A first draft claimed the user was UNDER-exposed to Rodrigues
      (80%) and Mederos (40%) on exactly that reasoning; withdrawn as pure hindsight. A
      second withdrawn claim: Gauge Young was called an error for sitting in 80% of
      entries while appearing in 2% of the top 100 — ex ante he was ordinary-to-good
      ($8,300, 60% win, 8.53 expected and 11.57 win-case per $1K, second and fourth of
      the seven), so his only real fault was losing. (2) SAMPLE SOURCE: the first
      measurement read `rules/mma_se/slate_data/` sidecars, which only exist from
      7/25/26 onward — 5 cards instead of 19 — and produced a FALSE realized finding
      (that $7,500-8,999 winners OUTSCORE $9,000+ winners, 107.6 vs 103.3). At 15 cards
      that reverses to 103.7 vs 101.6, and the correct statement is not "the mid tier
      scores more" but "a winner scores about the same at any price, so value per dollar
      falls as price rises." Measure from the vendor-sheet and standings archive in
      ~/Downloads via `scripts/mma_salary_bands.py` (Sim repo), never from sidecars
      alone. Also explains a result the 8/23 review flagged but could not account for:
      the entries carried ZERO Core-tier fighters and produced the best slate on record,
      because the board's Core tier prices probability while the tournament pays
      ceiling. Links [[mma-se-2026-08-23-core-tier-mirrors-the-field-chalk]],
      [[mma-se-2026-08-02-the-cheap-slot-decides-the-lineup]],
      [[mma-se-2026-05-30-win-case-ceiling-under-rates-low-own-finishers]],
      [[mma-se-2026-06-14-showdown-cap-single-favorite-exposure]],
      [[mma-se-2026-08-02-shared-coin-flip-slots-not-shared-players-kill-a-portfolio]].
    status: validated
    confirmations:
      - date: 2026-08-23
        slate: "EX ANTE across 19 MMA cards (474 fighters, vendor sheets only, 3/28-8/22)"
        note: >
          The core finding needs no results and no capture sidecars. Win-case points per
          $1K falls monotonically with salary (13.63 / 11.55 / 10.58) while expected
          points per $1K rises monotonically (5.47 / 7.32 / 8.76), and the ordering
          holds on 19 of 19 individual cards. The $9,000+ band sat in a 10.2-11.2 range
          on every card measured. Reproduce: `python scripts/mma_salary_bands.py`.
      - date: 2026-08-23
        slate: "REALIZED across 15 cards matched to DK standings (192 winners)"
        note: >
          Winners' absolute points are nearly flat across price — 103.7 / 101.6 / 94.1 —
          so points per $1K falls monotonically: 11.09 / 12.26 / 13.22, closely tracking
          the ex-ante win-case column. This SUPERSEDES the 4-card version of this row,
          which reported 103.3 vs 107.6 and wrongly had the mid tier outscoring the
          expensive tier.
      - date: 2026-08-23
        slate: UFC Fight Night Hernandez vs Rodrigues 8/22/26
        note: >
          The originating case. Realized tiers dead level — $9,000+ 112.2 (n=5),
          $7,500-8,999 111.5 (n=6), sub-$7,500 112.2 (n=2): $2,500 more per slot bought
          nothing. The $9,400-9,900 tier landed inside a 6-point band (Wint 110.06, Dyer
          107.52, Judice 106.46, Barbosa 104.76) while cheap winners spread 106.9-148.2
          (Emmers $6,900 106.86, Mederos $7,200 117.62, Rodrigues $7,600 148.20). Only
          12 of 77,079 legal lineups beat the Clinch winning score; the optimal carried
          one $9,000+ fighter, de Ridder $9,200, a finisher.
    contradictions: []
