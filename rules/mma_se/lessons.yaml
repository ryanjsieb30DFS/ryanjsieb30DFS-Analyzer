          BELOW projection and ~20 below the adjusted assumption. Concentration still
          happened, but onto non-consensus names: Thainara 32% -> 56.8% (the SE's true #1
          chalk, +25) and Salkilld 42% -> 54.5%. The SE's actual #1 pair was
          Thainara+Salkilld at 31%, not a Gamrot pair. Boundary to test before any
          narrowing proposal: this was the first slate where the consensus name was an
          UNDERDOG (45% win probability) — the field may converge above projection only
          on consensus FAVORITES and hedge away from consensus dogs.
      - date: "2026-08-23"
        slate: "UFC Fight Night: Hernandez vs. Rodrigues 8.22.26 — 594 3-Max + 784/1,426 SEs"
        origin_dir: "rules/mma_se/history/2026-08-23__ufc-fight-night-hernandez-vs-rodrigues-8-22-26"
        note: >
          SECOND mechanism contradiction of the SHARPENED form (the demotion threshold —
          a NARROWING proposal, not a retirement, goes to `## Proposed codifications`).
          The rule as codified says: find the consensus name by narrative agreement,
          then adjust its ownership UP. Anthony Hernandez was that name without
          ambiguity — main event, 56% projected (the board's #1), a 66% win chance, and
          the strategy applied the adjustment in writing: "Hernandez likely arrives near
          70% (7 of 10 teams)." He drew 54.0-56.9% ACTUAL — flat to projection, and ~14
          points below the adjusted assumption. The 8/9 boundary ("the field converges
          above projection only on consensus FAVORITES") is disconfirmed by the same
          event: Hernandez WAS a favorite and still did not run hot. The core claim is
          untouched — the field did converge above projection, just not on him: Chris
          Padilla 34% -> 44.6/49.7% (+11 to +16), Kennedy Nzechukwu 28% -> 38.2/39.8%
          (+10 to +12), Jeisla Chaves 7% -> 16.7% (+10), Serghei Spivac 24% -> 33.7%.
          Note the shape those four share and the top-priced consensus name does not:
          they are the CHEAP side. Padilla $8,000, Nzechukwu $7,800, Chaves $6,800,
          Spivac $7,700 — the salary savers a six-man build needs after paying up. Same
          shape at 8/16 (C. Johnson, the salary-saver, +10 to +15 while the projected #1
          Makhachev moved only +4-5) and at 8/9 (Thainara $7,300, +25, while the
          consensus #1 Gamrot came in 12-14 BELOW). Three consecutive slates point at
          the same narrower rule: apply the upward adjustment to the CHEAP consensus
          names that fit every build's salary shape, not to the top-priced narrative
          favorite.
    codified_in: "framework.md — Convergence Adjustment on the Consensus Favorite (8/2/26 — 3-slate validated)"
    retired_reason: null

  - id: mma-se-2026-07-19-sharp-envelope-is-a-rate-not-a-per-bullet-quota
    born: "2026-07-19"
    origin: "rules/mma_se/history/2026-07-19__ufc-oklahoma-city-7-18-26 (second-pass review)"
    statement: >
      The sharp-envelope target handed to a SINGLE-ENTRY builder must be read as the
      pros' per-lineup RATE, not restated as a per-bullet quota — and for MMA it must
      come from MMA data. sharp_playbook.md's shared-slate table (10 MMA contests)
      records the sharks carrying a sub-5%-owned piece in 15% of their lineups; across
      40-150 bullets that is a sprinkle, and the MODAL shark MMA lineup carries NO dart.
      The 7/19 strategy converted that 15% rate into "roughly one sub-15% piece per
      bullet" on a 2-entry slate — a ~7x inflation of the pros' observed behavior — and
      it drove the slate's only failed discipline metric (leverage candidates 0/2
      rostered) even though BOTH contest winners carried zero sub-10 pieces
      (winners_profile dart_pct 0.0 in both) and every board piece under 15% own lost.
      Corroborating: rules/shared/shark_baseline.json has NO `mma` sport key at all
      (the 63-contest seed covers nascar/golf/showdown only), and the single accumulated
      MMA shark observation in shark_observations.jsonl (7/12, one entry) measured
      leverage_pct 0.0 — there is no observed MMA envelope justifying a per-lineup dart
      target. Mechanism: a frequency measured across a pro's large portfolio describes
      portfolio-level variance budgeting; imposing it on each of 1-3 bullets converts an
      optional ceiling sprinkle into a mandatory dead slot, which is the one structure
      a single-entry player cannot afford. Rule to test: state sharp-envelope targets as
      "in ~N of 10 lineups," and for a 1-3 bullet slate translate any sub-50% rate into
      "optional — take it only when the dart's win equity clears the mid-own converter
      it would replace." Corollary: treat the shark-gap axis ranking as noise until the
      delta is material — the "own_per_slot is your biggest gap in 2 of 4 slates" line
      the strategy cited rested on measured deltas of 1.3 and 0.1 ownership points, and
      this slate had no tracked pro in either field (sharks_in_field false) to measure.
      Links [[mma-se-2026-07-19-winning-se-shape-six-winners-mid-own-converters]],
      [[mma-se-2026-06-27-leverage-is-the-low-own-finisher-not-the-named-dog]],
      [[mma-se-2026-05-17-one-leverage-swing-conviction-core]].
    status: codified
    confirmations:
      - date: "2026-08-02"
        slate: "UFC Fight Night 283, Belgrade 8.1.26 — 588 SE + 594 3-Max"
        origin_dir: "rules/mma_se/history/2026-08-02__ufc-fight-night-283-medi-vs-rodriguez-8-1-26"
        note: >
          First confirmation → promoted hypothesis → validated, on BOTH halves.
          RATE-NOT-QUOTA half: the strategy applied the lesson correctly this time,
          writing the Prepolec dart as "optional, not mandatory, per your
          rate-not-quota lesson" and moving the difference-maker tier up into the
          13-21% favorites. The user took the dart anyway in one 3-Max entry; Prepolec
          scored 2.6 and that entry finished 83.8%ile, while the two winners'
          differentiation came from converters (Urbina 113.86, Rebecki 143.72,
          Valentin 107.51). The optional-slot framing was right and the mandatory
          reading would have been wrong again. SHARK-AXIS-IS-NOISE corollary: confirmed
          harder than at 7/19. `shark_gap.json` returns `sharks_in_field: false` and
          `sharks.gradable: false` — no tracked pro appeared in either field, for the
          third time in five slates — yet the strategy still cited moklovin's ~30%
          own-per-slot as this slate's coaching target. The substitute measurement, the
          actual winners' structure, showed no structural gap at all: winners averaged
          29.5% and 29.9% own per slot against the user's 29.0% and 27.7%, and the
          winners carried FEWER low-owned pieces than he did. There was no structural
          axis to close on this slate; the entire gap was player selection.
      - date: "2026-08-09"
        slate: "UFC Fight Night: Gamrot vs. Salkilld 8.8.26 — 784 SE + 47,562 mini-MAX"
        origin_dir: "rules/mma_se/history/2026-08-09__ufc-fight-night-gamrot-vs-salkilld-8-8-26"
        note: >
          THIRD confirming slate — promotion candidate. RATE half: the strategy again
          stated the dart as optional ("for your single bullets the dart is optional,
          not mandatory") and pointed the difference-maker tier at the 14-16% converters
          (Foro/Johns/Miranda); the SE winners' top-20 carried ZERO sub-10 pieces and the
          mini-MAX winner's lone low-own piece was a named CONVERTER (Johns 14.2%,
          104.9). AXIS-IS-NOISE half: one tracked shark in the 784 field, own-per-slot
          delta -1.0 point (user 28.8 vs shark 29.8), identical leverage / anchor /
          uniqueness numbers — yet the shark finished 43.5%ile and the user 92.1%ile.
          Structure identical, outcome 49 percentile points apart: the whole gap was
          WHICH fighters (selection), not a structural axis. Third consecutive slate
          where the measured axis delta was <=1.3 ownership points.
      - date: "2026-08-16"
        slate: "UFC 330 8.15.26 — 2,378-entry Clinch SE"
        origin_dir: "rules/mma_se/history/2026-08-16__ufc-330-8-15-26"
        note: >
          Fourth confirming slate for the axis-is-noise corollary. One tracked shark
          in the Clinch field: own-per-slot 37.8 vs the user's 38.8 (delta 1.0
          point), leverage 0.0 = 0.0, anchor exposure 0.667 = 0.667 — structure
