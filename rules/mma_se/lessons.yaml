  - id: mma-se-2026-06-27-finish-heavy-small-fields-still-won-by-differentiation
    born: "2026-06-27"
    origin: "rules/mma_se/history/2026-06-27__ufc-baku-6-27-26"
    statement: >
      On finish-heavy boards even small (~500-entry) fields are won by DIFFERENTIATED
      builds, not chalk — so the "small field -> lean chalk-with-one-swing" field-size
      calibration needs a finish-heavy caveat. 6/27 Baku: all three contest winners ran
      ~16-18% avg own (490 winner coopjs23 16.57 / 2 sub-10; 594 winner 18.27; 1189 winner
      17.19), while the user's chalkiest build (490 entry, 43.37% avg own, 0 sub-10)
      finished 90.2%ile — dead last of his entries — and his most differentiated build
      (594 L3, 29.15% avg own, carrying Fiziev+Camilo+Hasanov) finished rank 8 / 1.3%ile.
      Mechanism: 10-of-13 finish equity produces wide outcome dispersion that lets
      low-owned finishers separate even in a 490 field, so chalk concentration that would
      be survivable on a decision-heavy slate gets buried. Rule to test: on slates with
      >=70% of fights projected to finish, hold the small-field build to the same ~16-20%
      avg-own / >=1 sub-10 differentiation target as the medium field — do not relax to
      chalk just because the field is small. Links [[mma-se-2026-05-17-field-size-calibration]],
      [[mma-se-2026-06-27-leverage-is-the-low-own-finisher-not-the-named-dog]].
    status: retired
    confirmations:
      - date: "2026-07-12"
        slate: "UFC 329 — two 291-field SEs, finish-heavy board"
        note: >
          Low-own-DEFINER half confirmed. Both 686.38 winning lineups carried the
          15-16%-owned slate-definer Mario Bautista, and every top-20 lineup carried at
          least one sub-20% converter (Bautista / Royval / Gandra). Catching >=1 low-owned
          definer was necessary to win — chalk-only builds could not reach 686.
    contradictions:
      - date: "2026-07-12"
        slate: "UFC 329 — two 291-field SEs"
        note: >
          Avg-own TARGET half contradicted by the winning structure — a mechanism
          refinement, not a retirement (GPP-guarded: this is the winner's structure, not
          "we lost"). The winning lineup was ~40.2% avg own with 0 sub-10 plays
          (Holloway 62% + Pimblett 50% + Pinas 41% + Bautista 15% + Gandra 32% +
          Green 35%); winners_profile avg_own_per_slot 40.2, dart_pct 0.0. This 291
          finish-heavy field was won by a chalk-ANCHORED build that caught ONE low-owned
          definer — NOT by a 16-20% avg-own build. The user's more-differentiated ~34-38%
          builds finished 26-34%ile. The edge here was not lower avg-own; it was running
          six fighters who all WON (96-137 pts, zero busts) including one low-owned
          converter, while the user's ceilings were capped by dead LOSING slots
          (Reese 2.0, McGregor 1.0). Reframe toward: "differentiate through low-owned
          WINNING favorites and carry no likely-loser slot," NOT "cut whole-build avg-own
          to 16-20%." Links [[mma-se-2026-05-16-binary-leverage-weak-in-small-fields]],
          [[mma-se-2026-07-12-distance-fight-is-not-low-ceiling]].
      - date: "2026-07-19"
        slate: "UFC Oklahoma City 7.18.26 — 784/1,189 SEs, finish-leaning card"
        note: >
          SECOND contradiction of the avg-own-target half (GPP-guarded: this is the
          winners' structure, not "we lost"). Both winners were chalk-anchored
          six-winner builds with ZERO sub-10 pieces: 784 winner 36.4% avg own
          (McMillen ~70% plus five 24-36% converters), 1,189 winner 31.6% avg own;
          winners_profile dart_pct was 0.0 in both contests (avg_own_per_slot
          37.5 / 37.1). The "hold small fields to 16-20% avg own / >=1 sub-10"
          target has now been contradicted by the winning structure in consecutive
          slates (7/12, 7/19). The half that keeps confirming (catch >=1 low-owned
          converter, carry no losing slot) is carried forward by
          [[mma-se-2026-07-19-winning-se-shape-six-winners-mid-own-converters]] —
          propose retiring this hypothesis.
    codified_in: null
    retired_reason: >
      Avg-own-target half contradicted by the winning structure in consecutive
      slates (7/12, 7/19); the surviving half (catch >=1 low-owned converter,
      carry no losing slot) is carried forward by
      mma-se-2026-07-19-winning-se-shape-six-winners-mid-own-converters.

  # ---- 2026-07-12 — UFC 329 (McGregor vs. Holloway) ----

  - id: mma-se-2026-07-12-distance-fight-is-not-low-ceiling
    born: "2026-07-12"
    origin: "rules/mma_se/history/2026-07-12__ufc-329"
    statement: >
      "Goes the distance / distance-leaning" is NOT the same as "low ceiling," and a whole
      fight must not be faded on that basis. MMA DK scoring rewards significant-strike
      volume, control time and takedowns heavily, so a fighter who wins a dominant,
      high-pace 15-minute decision can reach finish-level scores (120-140+) with no finish.
      UFC 329 evidence: the strategy tagged Sandhagen/Bautista a "trap to fade —
      distance-leaning, low-dominance, no path to a smash, eats salary without a ceiling,"
      and Mario Bautista (15-16% own) then won a paced decision for 137.43 — the #1 score
      on the board and in both 686.38 winning lineups. Wang Cong, from the other
      "distance/low-dominance" faded fight (Cong/Cortez), posted 90.46 (slate-defining).
      Mechanism: pace + volume + grappling control IS a ceiling; a distance projection caps
      ceiling ONLY when it is also low-volume/low-control (a true point-fighting stalemate).
      Rule to test: before fading a fight for going the distance, check projected
      pace/volume/control — a high-output fighter favored to win a dominant decision carries
      a real 100+ ceiling, and if low-owned that is leverage, not a trap. Links
      [[mma-se-2026-06-27-leverage-is-the-low-own-finisher-not-the-named-dog]],
      [[mma-se-2026-06-20-fade-on-structure-not-narrative]].
    status: codified
    confirmations:
      - date: "2026-07-19"
        slate: "UFC Oklahoma City 7.18.26 — 784/1,189 SEs"
        note: >
          First confirmation → promoted to validated. The strategy capped Fatima
          Kline's ceiling at "80-90 — a cash profile" purely because she was the
          favorite LEAST likely to finish (+285 ITD) — the exact
          distance-implies-low-ceiling equation this lesson bans — and LEAN-FADED
          her at $9.3K / 21%. Kline, a high-output wrestler favored to dominate,
          scored 109.40 and sat in the 1,189-field WINNING lineup (716.30). Caveat
          logged honestly: standings don't record method, so finish-vs-dominant-
          decision can't be separated — but the mechanism graded here is the ceiling
          CAP derived from low finish probability, and that cap was wrong by ~25
          points on a winner-defining piece.
      - date: "2026-08-02"
        slate: "UFC Fight Night 283, Belgrade 8.1.26 — 588 SE + 594 3-Max"
        origin_dir: "rules/mma_se/history/2026-08-02__ufc-fight-night-283-medi-vs-rodriguez-8-1-26"
        note: >
          THIRD confirming slate — promotion candidate. Same shape as the 7/19 Kline
          case, one tier of conviction higher. The strategy LEAN-FADED Navajo Stirling
          ($9K, 23% projected own) on an explicitly distance-based ceiling cap: "his big
          score requires the first round-one knockout of Blachowicz's entire career," in
          a fight it called "incredibly slow," closing with "if this fight hits round
          three I'd wager Stirling is dead on DraftKings." Stirling scored 106.1 —
          the slate's #7 score — and appeared in the 594-field's rank-10 lineup. His
          opponent scored 1.9, so the win was one-sided. Same honest caveat as 7/19:
          standings do not record method, so a late finish and a dominant decision
          cannot be separated. The mechanism being graded is not the method, it is the
          CEILING CAP inferred from low finish probability, and that inference has now
          been wrong on a slate-relevant scorer three times (7/12 Bautista 137.43, 7/19
          Kline 109.40, 8/2 Stirling 106.1). The pool_calibration file records the
          consequence: Stirling is the board's only tier-leakage entry, a `Fade`-tiered
          fighter who out-scored the entire `Okay` tier and dragged the tier ordering
          out of sequence. Also logged as the second ITD-cap failure under
          [[mma-se-2026-06-20-fade-on-structure-not-narrative]].
      - date: "2026-08-23"
        slate: "UFC Fight Night: Hernandez vs. Rodrigues 8.22.26 — 594 3-Max + 784/1,426 SEs"
        origin_dir: "rules/mma_se/history/2026-08-23__ufc-fight-night-hernandez-vs-rodrigues-8-22-26"
        note: >
          FOURTH confirming slate, and the most expensive one yet — the mis-capped
          fighter was in TWO of the three contest winners. The strategy called Chris
          Padilla UNDERWEIGHT with the distance clause stated outright: "$8,000 at 34%
          ownership for a 62.0 projection and 52% win chance ... the fight is -190 to go
          the distance." Padilla scored 111.35, the slate's #5 overperformer (+49.3 vs
          projection), and sat in the 784-field winner (mbhall3, 702.21) and the
          1,426-field winner (kpro790, 720.92). Same shape one slot down: Vitor Petrino
          was UNDERWEIGHT because his "fight [is] only -160 to end early; both fighters'
          last wins scored under 75" — a pure finish-probability cap — and he scored
          99.01 inside that same 784 winner. Both were tiered `Fade` on the board and
          both are the pool_calibration leakage entries (Padilla 111.3, Petrino 99.0
          out-scoring the whole `Okay` tier). The ceiling cap inferred from low finish
          probability has now been wrong on a winner-defining scorer four times
          (7/12 Bautista 137.43, 7/19 Kline 109.40, 8/2 Stirling 106.1, 8/23 Padilla
          111.35). Same honest caveat: standings do not record method.
    contradictions: []
    codified_in: "framework.md — Distance ≠ Low Ceiling (8/2/26 — 3-slate validated)"
    retired_reason: null

  # ---- 2026-07-19 — UFC Oklahoma City (Du Plessis vs. Usman) ----

  - id: mma-se-2026-07-19-winning-se-shape-six-winners-mid-own-converters
