    contradictions:
      - date: "2026-08-09"
        slate: "UFC Fight Night: Gamrot vs. Salkilld 8.8.26 — 784 SE + 47,562 mini-MAX"
        origin_dir: "rules/mma_se/history/2026-08-09__ufc-fight-night-gamrot-vs-salkilld-8-8-26"
        note: >
          FIRST mechanism contradiction (1 of the 2 needed for a demotion/narrowing
          proposal). The rule's sharpened form says: find the consensus name by narrative
          agreement, then adjust its ownership UP. This slate had the cleanest possible
          consensus signal — Gamrot was BOTH articles' #1 overall play AND the projected
          own leader (53%) — and the strategy applied the codified adjustment exactly as
          written ("real ownership near 60%+ is the working assumption"). The field went
