    statement: >
      A fade/underweight call written with an abbreviated name never becomes an
      enforceable call. The strategy's `## Fades` listed FIVE verdicts, but the
      strategy contract parsed only the three written with matchable names
      (Fernandes, McConico, Garry): "C. Johnson — UNDERWEIGHT" and "D. Johnson —
      UNDERWEIGHT" matched no projection row (a slate with TWO Johnsons), so the
      contract, the pick engine's strategy gate, and the adherence grader all
      silently carried 3 of 5 calls. The two dropped calls were slate-relevant:
      Donte Johnson scored 104.4 and was in EVERY winning lineup of both SEs,
      Charles Johnson 72.59 in all of them — and no tool ever graded the user's
      exposure to either. Mechanism: the verdict parser matches names against the
      projection pool, and an initial-plus-surname alias resolves to nothing; a call
      that fails to parse does not gate picks, does not appear in adherence, and
      leaves the review blind to whether the call was followed. Rule to test: the
      slate strategy writes every `## Fades` / `## Leverage` name in full (matching
      the projection file), and a contract whose parsed-call count differs from the
      rendered fade-line count warns at generation time. Links
      [[mma-se-2026-08-02-grade-gates-have-no-discriminating-power-in-mma]].
