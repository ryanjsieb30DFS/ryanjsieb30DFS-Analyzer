        slate: "UFC Fight Night: Ankalaev vs Guskov 7.25.26 — 490 + 1,189 SEs, 594 3-Max"
        origin_dir: "rules/mma_se/history/2026-07-26__ufc-fight-night-ankalaev-vs-guskov-7-25-26"
        note: >
          Mechanism confirmed in all three contests. Every winning roster was six
