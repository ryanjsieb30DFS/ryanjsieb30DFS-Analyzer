  # ---- 2026-07-26 — UFC Fight Night: Ankalaev vs Guskov 7.25.26 ----

  - id: mma-se-2026-07-26-field-value-side-vs-your-named-converter
    born: "2026-07-26"
    origin: "rules/mma_se/history/2026-07-26__ufc-fight-night-ankalaev-vs-guskov-7-25-26"
    statement: >
      When the strategy names a low-owned CONVERTING favorite as the leverage side
      of a specific fight, rostering that fight's field-value opposite instead is a
      double loss — you take the losing side of the fight AND hand back the named
      leverage. The strategy tiered Zaynukov Good-Leverage (21% projected own,
      138-point DWCS volume ceiling) and explicitly named him the definer of his
      fight; the user instead carried his opponent Rzepecki — the field's "safe
      value" at ~35% actual own — in 3 of 5 lineups. Zaynukov won (78.22 FPTS at
      16.8%); Rzepecki scored 23.66. Removing Rzepecki was the winning swap in BOTH
      one-swap contests, and the Rzepecki-to-Zaynukov swap alone would have won the
      3-Max outright (587.26 + 54.6 = 641.8 vs the 619.62 winner). Mechanism: the
      leverage read and the value read of the SAME fight are mutually exclusive
      bets; picking the value side silently reverses the strategy's stated edge in
      that fight, and adherence never flags it because only fades and sub-10
      candidates are graded. Links
      [[mma-se-2026-07-19-winning-se-shape-six-winners-mid-own-converters]],
      [[mma-se-2026-06-27-leverage-is-the-low-own-finisher-not-the-named-dog]].
    status: validated
    confirmations:
      - date: "2026-08-02"
        slate: "UFC Fight Night 283, Belgrade 8.1.26 — 588 SE + 594 3-Max"
        origin_dir: "rules/mma_se/history/2026-08-02__ufc-fight-night-283-medi-vs-rodriguez-8-1-26"
        note: >
          First confirmation → promoted hypothesis → validated. An exact replication of
          the 7/26 Zaynukov/Rzepecki event, one week later, in a bigger and more
          expensive fight. The strategy named Gilbert Urbina the leverage side of the
          Cepo/Urbina fight — tiered Good with a `· Leverage` tag, given his own
          `## Leverage` line ("survive two minutes, then wrestle: Cepo has no cardio, no
          ground game"), and flagged a second time inside the Cepo write-up ("remembers
          the live opposite side"). The user rostered the FIELD'S side of that same
          fight instead: Cepo, at 36% projected and 52% actual own, in 2 of 4 entries,
          and zero Urbina anywhere. Urbina scored 113.86 and carried BOTH contest
          winners; Cepo scored 2.8 and was the slate's #1 fish trap (75-76% of the
          bottom finishers, 0% of the winners). The double-loss mechanism is confirmed
          precisely: the losing side of the fight AND the surrendered leverage were the
          same decision. The invisibility half of the statement is confirmed too —
          `adherence.json` reports 0 fades violated and leverage covered 1 of 1, a
          spotless discipline grade, because the only tracked candidate was the formal
          sub-10% flier (Prepolec, 7% projected, 2.6 points) which the user DID roster.
          Urbina at 15% projected never entered the graded set. Two slates, same
          mechanism, same blind spot in the metric.
      - date: "2026-08-23"
        slate: "UFC Fight Night: Hernandez vs. Rodrigues 8.22.26 — 594 3-Max + 784/1,426 SEs"
        origin_dir: "rules/mma_se/history/2026-08-23__ufc-fight-night-hernandez-vs-rodrigues-8-22-26"
        note: >
