  - id: mma-se-2026-08-16-sim-rankings-are-a-threshold-not-an-ordering
    born: "2026-08-16"
    origin: "rules/mma_se/history/2026-08-16__ufc-330-8-15-26"
    statement: >
      Within the Sim's pool, the pre-lock ranking metrics carried NO ordering
      information this slate: across 3,156 lineups the correlation of each metric
      with the real scores was 0.002 (Top1%), -0.010 (ROI), -0.018 (Win%), -0.025
      (Cash%) — noise on all four. 8/9 read the same way on three of four metrics
      (-0.032 to 0.067, one at 0.187), so this is two consecutive slates of ~zero
      signal. The pool ITSELF was fine — its best lineup scored 647.24, above both
      winning scores (623.24 / 629.11) — and picking still beat the pool average in
      the two contests entered untouched (+26.9 and +44.2 points; the -62.1 contest
      was the hand-modified entry). Mechanism: MMA is ~12 near-binary events, so a
      lineup's simmed rank inside a pool of similar win-probability products is
      noise, while pool MEMBERSHIP (six live win-paths under the cap) is the real
      filter. Rule to test: treat sim metrics as a THRESHOLD (cut the pool's bottom,
      never order its top), let the strategy gate + slice angles do the choosing,
      and log rank_signal each slate — a third ~zero slate makes this a codifiable
      tool-calibration finding. Links
      [[mma-se-2026-07-19-winning-se-shape-six-winners-mid-own-converters]].
    status: hypothesis
    confirmations: []
    contradictions:
      - date: "2026-08-23"
        slate: "UFC Fight Night: Hernandez vs. Rodrigues 8.22.26 — 6,500-lineup pool, 3 contests"
        origin_dir: "rules/mma_se/history/2026-08-23__ufc-fight-night-hernandez-vs-rodrigues-8-22-26"
        note: >
          FIRST mechanism contradiction — the awaited third slate came back with real
          signal, not zero. Across the 6,500-lineup pool every metric correlated
          POSITIVELY with the real scores: ROI 0.322, Top1% 0.305, Cash% 0.304, Win%
          0.271 — an order of magnitude above 8/16's 0.002 / -0.010 / -0.018 / -0.025.
          The ordering was economically meaningful, not just non-zero: the top 100
          lineups by Win% averaged 526.84 actual points against a pool average of
          432.31 (+94.5), by ROI 503.79 (+71.5), by Top1% 502.59 (+70.3), by Cash%
          465.90 (+33.6). So the metrics DID order the top of the pool this slate, and
          the ranking-is-noise claim fails here. Boundary that keeps the hypothesis
          alive rather than retired: this card had 13 fights with wide finish equity
          and produced huge score dispersion (pool 432 average, 720.92 max), while
          8/9 and 8/16 were tighter title-card boards. The condition to test next is
          whether the ordering signal tracks the board's outcome DISPERSION rather
          than being noise everywhere. Practical note: the threshold-not-gospel
          instruction cost nothing this slate either way — picking beat the pool
          average by +183 to +272 points in all three contests.
