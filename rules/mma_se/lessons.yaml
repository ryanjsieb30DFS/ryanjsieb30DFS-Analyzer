      - date: "2026-08-23"
        slate: "UFC Fight Night: Hernandez vs. Rodrigues 8.22.26 — 1,426-entry Clinch SE"
        origin_dir: "rules/mma_se/history/2026-08-23__ufc-fight-night-hernandez-vs-rodrigues-8-22-26"
        note: >
          Fifth confirming slate for the axis-is-noise corollary, and the first with a
          MATERIAL delta — which is the point. Four straight slates measured gaps of
          <=1.3 ownership points and taught nothing. Here one tracked pro was in the
          Clinch field and the gap was finally large: average ownership per roster spot
          21.2 (user) vs 34.1 (pro), a 12.9-point delta, with chalk-anchor exposure 0.0
          vs 0.667. `shark_gap.json` labels that dimension "under-owning these is the
          recurring leak" — and it was inverted. The user finished 0.21%ile (rank 3 of
          1,426); the pro finished 29.03%ile. The reason is in the same file's anchor
          list: the chalk anchors were Anthony Hernandez (56.9% own, 74.4 points, 67%
          of the bottom half and 7.1% of the winners) and Chris Padilla, and zero
          exposure to the first was the whole edge. Sharpens the corollary: a material
          own-per-slot gap is still not a leak by itself — it only reads as one when
          the chalk anchors CONVERT, and whether they convert is unknowable pre-lock.
          The axis remains descriptive; it never becomes a target.
    contradictions: []
    codified_in: "framework.md — Envelope Targets Are Rates (8/16/26); philosophy.md — Envelope Targets Are Rates (8/16/26)"
