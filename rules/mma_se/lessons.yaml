  - id: mma-se-2026-07-19-projected-own-understates-consensus-chalk-convergence
    born: "2026-07-19"
    origin: "rules/mma_se/history/2026-07-19__ufc-oklahoma-city-7-18-26"
    statement: >
      In classic MMA SE the vendor's projected own% understates how hard the field
      converges on the consensus best play. DailyFan projected McMillen 42% (second
      to DDP's 45%); he drew 66.8-69.8% ACTUAL — the field's true chalk by 20 points —
      while DDP came in near projection (48.5-49.4%). Downstream math built on
      projected own inherits the error: the strategy's DDP+McMillen pair estimate
      (~18.9% of lineups) was HALF the actual 34.4%, and the real #1 pair was
      Bashi+McMillen at 34.6% (never flagged as the top combo). Mechanism: ownership
      projections spread the chalk tier too evenly; the live field concentrates
      harder on the single narrative-consensus favorite, so duplication estimates and
      "similar ownership" anchor-equivalence reads at the top of the board need an
      actual-convergence adjustment (the projected-own gap between the top two
      anchors is less trustworthy than the consensus signal itself). Classic-format
      cousin of [[mma-se-2026-06-14-showdown-trust-cpt-own-not-projected-overall-own]].
      COROLLARY added 2026-07-26 (third-pass review) — where the correction must come
      from, given MMA's roster turnover: the forward-fed `## Field tendencies` block is
      NAME-keyed, and MMA rosters turn over ~100% between slates, so the historical
      crowd list carries no transferable player information (the 7/12 list — Holloway,
      Pimblett, Steveson, Pinas — shares zero fighters with the 7/19 card). What DID
      transfer is SHAPE: in both slates the field's #1 duplicated pair was the single
      most-owned anchor plus another top-five chalk favorite (7/12 Holloway+Pimblett
      30.7%; 7/19 Bashi+McMillen 34.6%), and the 7/19 strategy read that shape
      correctly, naming a McMillen-anchored pair as the analogue. Only the MAGNITUDE
      failed, because it was computed from projected own (~18.9% vs 34.4% actual).
      Read the MMA field-tendency block for shape only, and size the duplication
      estimate from this slate's own chalk-combo math with an upward convergence
      adjustment — never from the historical names.
    status: codified
    confirmations:
      - date: "2026-07-26"
        slate: "UFC Fight Night: Ankalaev vs Guskov 7.25.26 — 490 + 1,189 SEs, 594 3-Max"
        origin_dir: "rules/mma_se/history/2026-07-26__ufc-fight-night-ankalaev-vs-guskov-7-25-26"
        note: >
          Same convergence direction, new consensus target. DailyFan projected
          Temirov at 28% (fifth-highest); he drew 42.4-46.9% ACTUAL — the field's
          true #1 chalk by 4-8 points over every projected-chalkier name. The
          projected chalk tier spread 27-34% while the live field concentrated on
          one consensus side; Sola also ran hot (26% projected, 38-40% actual) and
          Rzepecki (28% projected, ~35% actual). Meanwhile the projected #1 Walker
          (34%) came in AT projection (34.3) — the error is concentration on the
          consensus favorite, not a uniform shift, which is exactly the stated
          mechanism.
      - date: "2026-08-02"
        slate: "UFC Fight Night 283, Belgrade 8.1.26 — 588 SE + 594 3-Max"
        origin_dir: "rules/mma_se/history/2026-08-02__ufc-fight-night-283-medi-vs-rodriguez-8-1-26"
        note: >
          THIRD confirming slate — promotion candidate — and the largest convergence gap
          measured so far. DailyFan projected Vlasto Cepo at 36% (second on the board);
          he drew 51.9% and 52.7% ACTUAL — the field's true #1 chalk by more than 8
          points over every other name, and a +16 point miss. The same upward
          concentration hit the rest of the consensus tier: Nikolic 27% projected ->
          43.4/46.1% actual (+17), Todorovic 28% -> 37.2/39.7%, Gugnon 34% ->
          39.8/41.2%. Meanwhile the PROJECTED #1, Medic at 42%, came in BELOW projection
          at 37.6/38.4% — the third consecutive slate where the error is concentration
          on whichever name the field's narrative crowns, not a uniform upward shift,
          and the third consecutive slate where the projected #1 was NOT that name.
          Downstream damage exactly as the mechanism predicts: the strategy's chalk-combo
          math, computed from projected own, put Medic+Cepo at ~15% of lineups (~90 of
          594) and never flagged a Cepo-anchored pair as the top combo. The ACTUAL #1
          duplicated pair was Nikolic+Cepo at 25.2/25.5% (147 and 151 lineups) — roughly
          1.7x the estimate, and a pair the strategy never named. Every one of the
          field's top four actual pairs was Cepo-anchored; every one of the strategy's
          four projected pairs was Medic-anchored. SHARPENED FORM for the codification:
          identify the consensus name from narrative agreement across sources, not from
          the projected-own ranking, and apply the upward adjustment to THAT name's
          pairs before computing duplication.
      - date: "2026-08-16"
        slate: "UFC 330 8.15.26 — 2,378/1,176 SEs + 891 3-Max"
        origin_dir: "rules/mma_se/history/2026-08-16__ufc-330-8-15-26"
        note: >
          Fourth confirmation, and it supports the 8/9 boundary (the field converges
          above projection on consensus FAVORITES, not dogs). The consensus-narrative
          favorites ran far above projection — Orolbai 40% projected -> 48.8-57.2%
          actual (+9 to +17, the Clinch's true #1 chalk), C. Johnson 43% -> 52.5-57.9%
