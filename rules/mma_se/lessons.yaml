          sub-10s (Nicoll 5%, Melisano 8%) both LOST — when the sub-10 tier carries
          only ~12-17% win equity, the definer tier moves UP into the 15-30%
          converting sides, exactly where the 7/12 sharpened form said to screen.
          The codifiable mechanism is "screen the FULL pool for low-owned CONVERTERS
          (12-30% own, favorites included), never default to the article-named dog"
