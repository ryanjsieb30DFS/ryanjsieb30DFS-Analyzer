  # ---- Indexed from the 2026-05-17 framework/philosophy (operating rules not tied to a single autopsy) ----

  - id: mma-se-2026-05-17-field-size-calibration
    born: "2026-05-17"   # date of the framework/philosophy docs these rules were codified in
    origin: "framework.md — Step 3 — Field-Size Calibration (also philosophy.md — Field Size Matters More in SE)"
    statement: >
      Required differentiation scales with field size: under ~500 entrants a
      chalk-leaning conviction core with one quality swing can win; 500-1,500 needs
      genuine differentiation (~60-65% conviction / 35-40% leverage); 1,500+ demands
      fading a top chalk or pairing contrarian pieces, because the chalk is more
      locked in and shared outcomes can't separate you.
    status: codified
    confirmations: []
    contradictions: []
    codified_in: "framework.md — Step 3 — Field-Size Calibration"
    retired_reason: null

  - id: mma-se-2026-05-17-one-leverage-swing-conviction-core
    born: "2026-05-17"   # date of the framework/philosophy docs these rules were codified in
    origin: "philosophy.md — Conviction vs. Contrarian in SE (also framework.md — Steps 1-2)"
    statement: >
      A SE is one shot, so conviction plays are the load-bearing walls: lock 2-3
      conviction anchors (~70% of the build) and include exactly ONE sub-20%-owned
      leverage swing (~30%) that supports the core rather than carrying it. Unlike
      MME, a single lineup cannot afford to ride a contrarian bet as its core thesis.
    status: codified
    confirmations:
      - date: "2026-08-02"
        slate: "UFC Fight Night 283, Belgrade 8.1.26 — 588 SE + 594 3-Max"
        origin_dir: "rules/mma_se/history/2026-08-02__ufc-fight-night-283-medi-vs-rodriguez-8-1-26"
        note: >
          FIRST confirmation of the "exactly ONE sub-20% leverage swing" half, offsetting
          the 7/19 contradiction. Both contest winners carried a sub-20%-owned swing that
          SUPPORTED a chalk-anchored core rather than carrying it. The 588 winner:
          Urbina 9.86% and Valentin 18.37% behind Nikolic 43.4% / Grad 33.3% / Musayev
          28.1%. The 594 winner: exactly one sub-20 piece, Urbina at 11.95%, behind
          Gugnon 41.3% / Oliveira 36.2% / Leka 34.0%. Neither winner's contrarian piece
          was the thesis; in both it was the one differentiating slot on a conviction
          spine, which is precisely the structure this rule prescribes. Boundary carried
          forward from 7/19: the sub-20 slot is the right SHAPE, but it must be filled
          by a fighter who can WIN — the same slot filled with a KO-or-bust dog
          (Prepolec, 7%, 2.6 points) sank the entry that used it.
    contradictions:
      - date: "2026-07-19"
        slate: "UFC Oklahoma City 7.18.26 — 784/1,189 SEs"
        origin_dir: "rules/mma_se/history/2026-07-19__ufc-oklahoma-city-7-18-26"
        note: >
          FIRST mechanism contradiction of the "exactly ONE sub-20%-owned leverage
          swing" half (1 of the 2 needed for a demotion proposal). GPP-guarded: graded
          on the winners' structure, not on losing. NEITHER contest winner carried a
          sub-20%-owned piece — the 784 winner's lowest-owned fighter was Barbosa at
          23.85% and the 1,189 winner's was Barbosa at 20.35%, with winners_profile
          dart_pct 0.0 in both contests. The user's entries also carried no sub-20 swing
          and one of them still finished 18/784. On this board the sub-20 tier was not
          merely unnecessary, it was uniformly wrong (every piece under 15% own lost).
          The load-bearing half of the lesson — 2-3 conviction anchors carrying the
          build — held fine; it is the mandatory sub-20% swing that the winning
          structure contradicted. Refinement to test: the swing's job (differentiation)
          is real, but at these field sizes it is discharged by a mid-owned CONVERTER,
          not by an ownership threshold. Links
          [[mma-se-2026-07-19-winning-se-shape-six-winners-mid-own-converters]],
          [[mma-se-2026-05-16-secondary-plays-are-not-leverage]].
    codified_in: "philosophy.md — Conviction vs. Contrarian in SE; framework.md — Steps 1-2"
    retired_reason: null

  # ---- 2026-06-14 — UFC Freedom 250 (White House), captain-mode showdown ----

  - id: mma-se-2026-06-14-showdown-flex-spine-diversity
    born: "2026-06-14"
    origin: "rules/mma_se/history/2026-06-20__ufc-250-freedom-6-14-26"
    statement: >
      In captain-mode showdown, "distinct captains" can mask a shared 5/6 flex spine:
      lineups with different captain hats but the same five flex fighters are a single
      bet, so one fighter's bust craters the whole cluster together. The red team
      flagged exactly this (L1/L9/L10 all carried the Topuria+Pereira+Zahabi+Chandler
      spine and differed only by one flex plus the captain) and the FIX was ignored;
      Pereira then busted (4.8) and the trio finished 58.8% / 50.0% / 76.2% as a
      block, the predicted failure mode realized. Enforce flex-spine diversity (cap
      shared flex at <=4/6 across any pair), not just distinct captains, when judging
      portfolio uniqueness in showdown.
    status: retired
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: >
      merged into mma-se-2026-06-14-showdown-captain-the-ceiling-pair-the-smash
      (2026-08-02 ledger hygiene, user-approved). Both entries described one
      mechanism — in showdown the winning lineup is an assembled COMBINATION, not a
      set of correct individual reads — one stated about the flex spine, the other
      about the captain slot. The flex-spine content survives verbatim as clause (a)
      of the surviving lesson; both had sat dormant for seven slates and one entry is
      easier to apply when a showdown card next appears.

  - id: mma-se-2026-06-14-showdown-cap-single-favorite-exposure
    born: "2026-06-14"
    origin: "rules/mma_se/history/2026-06-20__ufc-250-freedom-6-14-26"
    statement: >
      A single non-captain favorite carried in 7-9 of 10 showdown lineups is a
      portfolio-level correlated bet, not diversification — when that chalk favorite
      busts it sinks the bulk of the portfolio at once. Topuria (81% main-event chalk,
      proj 90) was in 7/10 lineups and LOST to Gaethje; the only two lineups to clear
      500 points (L4 rank 14/5,945, L7 rank 821) were the two Topuria-free builds, and
      both also carried the upset dog. The portfolio was saved by two fades that were
      accidents of salary relief, not a deliberate hedge. Rule to test: cap any single
      favorite's flex share (~<=60% of lineups) and ALWAYS carry >=2 lineups that fade
      the chalkiest favorite / the main-event chalk. Links [[mma-se-2026-06-14-showdown-flex-spine-diversity]];
      generalizes the red team's "Bo in 9/10 with zero hedge" finding (Bo won, so the
      realized evidence is Topuria, but the mechanism is identical).
    status: validated
    confirmations:
      - date: "2026-06-20"
        slate: "UFC Fight Night 6/20 (CLASSIC, not showdown — mechanism is format-agnostic)"
        note: >
          Classic-format confirmation of the cap mechanism, WITH a boundary correction.
          Confirm: Rodriguez (21% leverage favorite) was capped at 6/10 with four
          deliberate Rodriguez-free hedge builds; he hit (114.29) but the cap cost nothing
          because the hedges existed, and the field winner itself faded the main-event
          chalk (606.69 = Stirling/Borjas/Rodriguez/Santos/Chokheli/Oliveira, zero
          main-event fighters) — capping/hedging the chalkiest favorite was directionally
          right. BOUNDARY: the build over-applied "fade the main-event chalk" all the way
          to 0/10 exposure on BOTH sides (Horiguchi 47% + Kape 42%), which the red team
          flagged as an Anchor-Equivalence violation (the rule requires running the
          alternative anchor in >=1 lineup; 0/10 satisfies neither side). The user HEEDED
          the red team and restored the main event before lock (actual entries: Horiguchi
          ~22.7%, Kape in the SEs + several mini-MAX) — and that restoration produced the
          user's single best lineup (553.52, 1.7%ile, which carried Kape). Mechanism
          refinement to carry forward: "cap + carry >=2 fades" must NOT collapse into
          "zero exposure," which crosses from diversification into an anchor-equivalence
          breach. Cap the favorite; do not zero it. Links [[mma-se-2026-05-30-anchor-equivalence-fifth-validation]].
      - date: "2026-08-02"
        slate: "UFC Fight Night 283, Belgrade 8.1.26 — 594 3-Max (classic format)"
        origin_dir: "rules/mma_se/history/2026-08-02__ufc-fight-night-283-medi-vs-rodriguez-8-1-26"
        note: >
          Second classic-format confirmation — the predicted failure mode realized
          exactly. Vlasto Cepo was carried in 2 of the 3 3-Max entries (67% exposure,
          above the rule's ~60% cap) and busted at 2.8 points. Both carrying entries
          died together at 83.8%ile and 86.9%ile; the single Cepo-free entry finished
          17.2%ile — a roughly 5x better finish. That is the correlated-bet mechanism
          this rule exists to prevent, on a classic card rather than a showdown one.
          NOTE on the format gate: the 7/26 review called this lesson "format-gated,
          cannot advance on classic cards," but its own 6/20 confirmation was already
          logged on a classic slate, so that gate was recorded in error and is dropped
          here — the mechanism is format-agnostic. DELIBERATELY NOT COUNTED toward the
          3-slate codification threshold: this is the same Cepo event already credited
          to [[mma-se-2026-05-30-asymmetric-anchor-equivalence-weighting]], and one
          event should not buy two promotions. Stays at 2 of 3; needs an independent
          third slate where an over-exposed favorite sinks a portfolio block.
      - date: "2026-08-23"
        slate: "UFC Fight Night: Hernandez vs. Rodrigues 8.22.26 — 594 3-Max"
        origin_dir: "rules/mma_se/history/2026-08-23__ufc-fight-night-hernandez-vs-rodrigues-8-22-26"
        note: >
          BOUNDARY NOTE, deliberately NOT counted as a confirmation — the cap was
          broken and cost nothing, which sharpens the rule's OBJECT. Two favorites ran
          at 100% exposure across the three 3-Max entries, far above the ~60% cap:
          Shanelle Dyer (85% win chance) and Gauge Young (60%). Both won; the block
          finished 1.9 / 4.4 / 14.0 percentile with no correlated failure. The
          difference from Topuria (6/14) and Cepo (8/2) is not the exposure number, it
          is the WIN PATH: Cepo needed an early knockout and had no decision floor, so
          his failure resolved to ~zero in every entry that held him, while Dyer wins on
          volume over 15 minutes and scores in a decision. The main-event hedge the rule
          actually asks for WAS carried — the pick engine's note says entry 3 "carries
          no main-event fighter at all, so if Hernandez wins, one entry is still alive
          instead of all three dying together," and Rodrigues then won anyway. Refinement
          to fold into any future codification: cap exposure to a BINARY favorite (one
          whose only scoring path is a finish), not to any favorite — an 85%-win
          fighter with a decision floor at 100% exposure is a conviction anchor, not a
          correlated bet. Still 2 of 3.
    codified_in: null
    retired_reason: null

  - id: mma-se-2026-06-14-showdown-trust-cpt-own-not-projected-overall-own
    born: "2026-06-14"
    origin: "rules/mma_se/history/2026-06-20__ufc-250-freedom-6-14-26"
    statement: >
      In 150-Max captain-mode showdown the field fragments across captains, so
      projected OVERALL own% (the DailyFan number that sums to ~600 over 6 slots)
      massively overstates real exposure: the consensus top fighter Hokit projected
      ~75 overall but drew only ~12.6% actual captain own, and the entire "chalk" sat
      in single digits to low-teens actual. DailyFan's CAPTAIN-own column, by contrast,
      was well calibrated (Hokit 16->12.6, Bo 7->6.1, Ruffy 3->4.0, Gane 10->7.8). The
      upset finisher that won (Gaethje) hid behind 44% projected overall / 7.9% actual.
      Implication: make leverage/fade calls off CPT-own, not projected overall own —
      "fading chalk" by overall own often fades something the field barely rosters, and
      a low-actual-own converting favorite is the real edge. (Calibration weight is a
      note, not a rule yet — small sample; see vendor_calibration.jsonl.)
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: mma-se-2026-06-14-showdown-cheap-slot-prefer-floor-or-live-dog
    born: "2026-06-14"
    origin: "rules/mma_se/history/2026-06-20__ufc-250-freedom-6-14-26"
    statement: >
      The cheap salary-relief slot in showdown frequently decides the lineup, so it
      should prefer a decision-floor fighter or the live finishing dog over pure
      "makes-the-math-work" chalk relief. Chandler (44% proj, pure relief) was carried
      in 8/10 lineups and scored 1.2 (busted); the winning roster and the user's best
      lineup (L4) instead used Zahabi (decision floor — his fight went the distance for
      volume) and Gaethje (the live KO dog who hit). The build leaned Chandler (8) over
      Zahabi (6) despite its own analysis naming Zahabi the only dog with a decision
      floor. Confirms the red team's cheap-slot field-duplication finding in hindsight.
    status: codified
    confirmations:
      - date: "2026-06-20"
        slate: "UFC Fight Night 6/20 (classic — same cheap-slot decision, split by field)"
        note: >
          Format split validated. The analysis's Decision 4 split the cheap slot by field
          size: decision-floor favorite for the small SEs, live finishing dog for the big
          field. BIG-FIELD live-dog half CONFIRMED — Borjas/Bolanos (the live finishing
          punts) were the two slate-defining plays and Borjas anchored both the field winner
          and the user's best lineup. SMALL-FIELD floor half CONFIRMED with a process catch:
          the build's selected SE bullet (L1) initially filled the cheap slot with a
          live DOG (Shahbazyan, +310, NO floor) instead of the decision FLOOR (Horiguchi)
          the analysis prescribed — the red team flagged exactly this ("swap Shahbazyan ->
          Horiguchi to restore the prescribed value-favorite floor"), the user heeded it,
          and Shahbazyan scored 0.0 while the restored-Horiguchi SE entries cleared their
          fields (16.1%ile / 31.8%ile). The lesson's core claim — the cheap slot decides
          the lineup, so prefer a floor or a LIVE finishing dog over no-floor variance —
          held on both halves of the field split.
      - date: "2026-08-02"
        slate: "UFC Fight Night 283, Belgrade 8.1.26 — 588 SE (classic format)"
        origin_dir: "rules/mma_se/history/2026-08-02__ufc-fight-night-283-medi-vs-rodriguez-8-1-26"
        note: >
          THIRD confirming slate — promotion candidate. The cheap slot literally decided
          the contest. The user's SE bullet filled it with Hailey Cowan ($6.7K), pure
          math-relief the strategy itself described as "the article's 'could end up
          optimal in a loss with 30 points' cheap-team filler" — i.e. a slot with no win
          path, chosen to make the salary work. She scored 5.2. The autopsy's near-miss
          analysis returns `swaps_needed: 1` and `best_swap: Cowan -> Rebecki, gain
          138.5, would_have_won: true` — one cheap-slot change, and a 68th-of-588 finish
          becomes the win. Neither contest winner used a no-win-path punt: every one of
          the twelve winning-roster slots across both contests belonged to a fighter who
          WON his fight (76.2 to 143.7 points). NOTE on the format gate: the 7/26 review
          recorded this as showdown-only, but the 6/20 confirmation was already logged on
          a classic card, so the gate was an error and is dropped — the mechanism is
          format-agnostic and this classic-card evidence counts. Overlaps
          [[mma-se-2026-07-19-winning-se-shape-six-winners-mid-own-converters]]'s
          "carry no losing slot" clause; that lesson is graded on the whole roster, this
          one on the cheap slot specifically.
    contradictions: []
    codified_in: "framework.md — The Cheap Slot Decides the Lineup (8/2/26 — 3-slate validated)"
    retired_reason: null

  - id: mma-se-2026-06-14-showdown-captain-the-ceiling-pair-the-smash
    born: "2026-06-14"
    origin: "rules/mma_se/history/2026-06-20__ufc-250-freedom-6-14-26"
    statement: >
      MERGED 2026-08-02 — absorbs mma-se-2026-06-14-showdown-flex-spine-diversity.
      In captain-mode showdown the winning lineup is an assembled COMBINATION, not a set
      of correct individual reads — so both portfolio uniqueness and captain assignment
      must be judged on the combination, not on the hat.
      (a) UNIQUENESS IS JUDGED ON THE FLEX SPINE, NOT THE CAPTAIN. Lineups with different
      captains but the same five flex fighters are a single bet; one bust craters the
      cluster together. Cap shared flex at <=4 of 6 across any pair. Evidence: L1/L9/L10
      shared the Topuria+Pereira+Zahabi+Chandler spine, the fix was ignored, Pereira busted
      at 4.8, and the trio finished 58.8 / 50.0 / 76.2 as a block.
      (b) THE HIGHEST-CEILING PLAY MUST OCCUPY THE 1.5x CAPTAIN SLOT IN >=1 LINEUP, and
      the lowest-owned high-ceiling smash must appear alongside the STRONGEST flex core in
      >=1 build, not isolated. Evidence (UFC 250 Freedom, contest 191363697, field 5,945):
      Gaethje (the winning captain) was rostered 2/10 and captained 0/10; Ruffy (4% own,
      177.3 — the slate definer) appeared in 1/10 and was captained there away from the
      optimal core, finishing 821st. The user's reads were elite (100% overperformer
      capture, +13% vs projection, best build rank 14/5,945) yet finished 3.06 pts behind
      moklovin's winning lineup (CPT Gaethje + Ruffy + Hokit/Nickal/Gane/Zahabi). The
      winning combination existed across the pool but was never assembled in one lineup.
      This is the volume-independent half of the coverage gap — the captain fix needs no
      extra bullets. Links
      [[mma-se-2026-06-14-showdown-trust-cpt-own-not-projected-overall-own]]; the
      cross-sport analog is the golf [[feedback_cpt_anchor_equivalence]] /
      never-zero-top3-anchor coverage point. Per [[feedback_play_like_sharks]], moklovin
