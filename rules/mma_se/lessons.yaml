          67.8%ile: a 45-percentile gap that was entirely WHICH fighters. Fourth
          consecutive slate with the measured axis delta <= 1.3 ownership points.
          Note also the strategy cited moklovin's 27.8% own-per-slot as the coaching
          target while the live in-field shark ran 37.8% — the envelope number
