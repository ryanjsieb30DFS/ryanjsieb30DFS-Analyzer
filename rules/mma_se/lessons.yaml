  - id: mma-se-2026-08-02-shared-coin-flip-slots-not-shared-players-kill-a-portfolio
    born: "2026-08-02"
    origin: "rules/mma_se/history/2026-08-02__ufc-fight-night-283-medi-vs-rodriguez-8-1-26"
    statement: >
      A multi-entry portfolio can pass every uniqueness check and still die as a single
      bet, because uniqueness counts SHARED PLAYERS while what actually correlates the
      entries is SHARED COIN-FLIP SLOTS. On 8/2 the three 3-Max entries were 100% unique
      with a maximum overlap of 3 of 6 fighters — inside every existing diversification
      rule — yet two of the three finished 83.8%ile and 86.9%ile as a block. The reason
      is that their overlap was concentrated in the two slots most likely to produce a
      zero: Cepo (2.8 points) and Janicic (2.6 points) sat in both, and both were
      explicitly identified in the strategy as binary or coin-flip spots (Cepo "win by
      early knockout or don't win at all," Janicic one half of a near-even banger the
      articles said could go either way). The third entry, which shared Valentin with the
      other two but neither dead slot, finished 17.2%ile. Mechanism: a shared ANCHOR
      degrades two entries by roughly the same modest amount when it disappoints, but a
      shared BINARY slot resolves to zero simultaneously in every entry that holds it, so
      two entries sharing two coin-flips are effectively one bet on a 25% outcome no
      matter how different the other four slots look. Counting overlap by player treats
      those two cases identically. Rule to test: when diversifying a multi-entry
      portfolio, count shared BINARY/coin-flip slots separately from shared conviction
      anchors, and cap shared coin-flips at one per pair of entries even when total
      roster overlap is already within limits. Sharpens the object of
      [[mma-se-2026-05-16-no-identical-conviction-cores]]; links
      [[mma-se-2026-05-16-binary-leverage-weak-in-small-fields]],
      [[mma-se-2026-06-14-showdown-cap-single-favorite-exposure]].
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: mma-se-2026-08-02-grade-gates-have-no-discriminating-power-in-mma
    born: "2026-08-02"
    origin: "rules/mma_se/history/2026-08-02__ufc-fight-night-283-medi-vs-rodriguez-8-1-26"
    statement: >
      The Grade tab's pre-lock gates are not separating good MMA entries from bad ones,
      and the self-validation record now says so twice. On 8/2 `retro_grade` — which
      re-grades the ENTERED lineups against ACTUAL ownership, i.e. with perfect hindsight
      on the one input the gates depend on — returned ZERO flags on all four lineups,
      whose finishes ranged from 11.6%ile to 86.9%ile. Combined with 7/26 (also zero
      flags, finishes 3.5%ile to 71.0%ile) that is nine consecutive clean lineups
      spanning nearly the whole field, which is the definition of a check that cannot
      discriminate. Mechanism: every MMA gate is keyed to ownership or to the board's
      tiers, and on this slate both were wrong in the same direction — Cepo was neither a
      fade nor bottom-tier (he was tiered Core at 36% projected own), and the crowded-pair
      check was computed from projected own so all four flagged pairs were Medic-anchored
      while the field's four actual top pairs were all Cepo-anchored. The no-leverage gate
      is info-only for MMA by design, and the ownership-target gate cannot fire on entries
      that already sit inside the winners' envelope. So the one structural risk that
      decided the slate — two entries built on the fighter the field converged on — was
      invisible to every gate. Rule to test: derive the crowded-pair and ownership gates
      from a convergence-ADJUSTED ownership estimate rather than raw projected own (per
      [[mma-se-2026-07-19-projected-own-understates-consensus-chalk-convergence]]), and
      add a gate for no-win-path slots, which is the failure the last three slates
      actually share. Until a gate fires on a losing lineup and stays silent on a winning
      one, treat a clean grade as carrying no information. Links
      [[mma-se-2026-07-19-exact-roster-duplication-is-superlinear-in-consensus]].
    status: codified
    confirmations:
      - date: "2026-08-09"
        slate: "UFC Fight Night: Gamrot vs. Salkilld 8.8.26 — 101 entered lineups"
        origin_dir: "rules/mma_se/history/2026-08-09__ufc-fight-night-gamrot-vs-salkilld-8-8-26"
        note: >
          First confirmation -> promoted to validated, at 25x the prior sample size.
          `retro_grade` returned ZERO flags on all 101 entered lineups, whose finishes
          spanned 1.0%ile to 98.7%ile — essentially the entire field. That is now ~110
          consecutive clean MMA lineups across three slates with no flag ever fired. The
          failure the gates keep missing repeated exactly: the SE bullet carried three
          no-win-path/dead slots (Gamrot 1.8, Sutherland 1.5, Goff 17.0) and graded
          clean at 92.1%ile. The proposed no-win-path gate and convergence-adjusted
          ownership inputs remain the fix to test.
      - date: "2026-08-16"
        slate: "UFC 330 8.15.26 — 5 entries, 3 contests"
        origin_dir: "rules/mma_se/history/2026-08-16__ufc-330-8-15-26"
        note: >
          Second confirmation (origin + 2 = three slates) -> promotion candidate.
          `retro_grade` returned ZERO flags on all 5 entered lineups, whose finishes
          spanned 11.8%ile to 67.8%ile — now ~115 consecutive clean MMA lineups with
          no flag ever fired. The failure class repeated exactly: the Clinch entry
          carried four sub-51-point slots (Orolbai 50.0, Chapolin 39.96, Brahimaj
          26.95, Luque 20.52) and graded clean at 67.8%ile. The proposed no-win-path
          gate and convergence-adjusted ownership inputs remain the fix.
      - date: "2026-08-23"
        slate: "UFC Fight Night: Hernandez vs. Rodrigues 8.22.26 — 5 entries, 3 contests"
        origin_dir: "rules/mma_se/history/2026-08-23__ufc-fight-night-hernandez-vs-rodrigues-8-22-26"
        note: >
          Third confirmation, and the one that settles WHY the gates say nothing.
          `retro_grade` returned ZERO flags on all 5 entered lineups — now ~120
          consecutive clean MMA lineups across four slates with no flag ever fired.
          What is new is the outcome attached to the clean grade: those 5 finished
          0.2 / 1.3 / 1.9 / 4.4 / 14.0 percentile, the best slate on record. Three
          slates ago the same all-clean grade sat on 92.1%ile. A check that reads
          identical on the worst and the best slate in the ledger is measuring
          nothing — that is the definition in the statement, now demonstrated from
          both ends of the range rather than inferred. The proposed no-win-path gate
          would at last have had discriminating power here: every one of the 30
          entered roster slots belonged to a fighter with a live win path and bust
          exposure came back 0.0, which is exactly the property the winning entries
          shared and the field's fish did not (Hernandez 67% of the fish, 7.1% of the
          winners). Build the gate on win paths, not ownership.
    contradictions: []
    codified_in: "framework.md — A Clean MMA Grade Carries No Information (8/16/26)"
    retired_reason: null

