    statement: >
      In small-to-medium MMA SE fields (~300-1,200), the winning shape is SIX WINNING
      FIGHTERS in a chalk-anchored build (~32-40% avg own, zero sub-10 darts), with
      the differentiation carried by 2-4 MID-OWNED (15-30%) CONVERTING favorites the
      field under-trusts — not by true darts. Evidence: the 7/12 winner (40.2% avg
      own, 0 sub-10, definer Bautista 15%) and BOTH 7/19 winners (36.4% / 31.6% avg
      own, 0 sub-10, definers Harris 29% / Kline 21.6% / Barbosa 20-24% / Franco
      24-26%); meanwhile every 7/19 board piece under 15% own LOST (Nicoll 5, Melisano
      8, Ramirez 15→0.80, Ricci 13, Cannonier 15), and the user's entries died not on
      structure (39.4% / 33.2% avg own sat inside the winners' envelope) but on WHICH
      mid-owns — Bashi 42.90 / Hines 4.40 / Anderson 7.41 were losing sides. Mechanism:
      at these field sizes 1-2 correctly-chosen 20-30% converters plus ZERO losing
      slots out-separates dart-carrying; the whole edge is win-side selection in the
      mid-tier, not ownership suppression. Supersedes the avg-own half of
      [[mma-se-2026-06-27-finish-heavy-small-fields-still-won-by-differentiation]];
      links [[mma-se-2026-06-27-leverage-is-the-low-own-finisher-not-the-named-dog]],
      [[mma-se-2026-05-16-binary-leverage-weak-in-small-fields]].
    status: codified
    confirmations:
