    statement: >
      The Anchor-Equivalence twin call ("run the less-owned twin") is made on the vendor's PROJECTED ownership, but when both articles push the same twin the field reads the same articles and the projected less-owned twin can close as the MORE-owned one; the call needs a lock-time ownership check, and the user's exposure to the chosen twin must stay under the field's actual rate, not the projected one. Why: projected ownership is a pre-article snapshot; a matchup writer's strong read (Silva's "QB2" on Mahomes, "this defense has not contained" Nix) moves thousands of late entries the same direction the strategy moved. Origin: ETR projected Mahomes 69.7% / Nix 64.3%, the strategy named Nix the less-owned twin and the user carried Nix in 4 of 5 entries (80%) and Mahomes in 3 of 5; at lock Nix was the slate's most-owned player at 74.4% and Mahomes fell to 66.8% — the set was LONGER than the crowd on the twin it meant to lean toward. Counts as confirmed when: a logged slate's projected less-owned twin closes higher-owned than his partner and the user's exposure to him sits above the field's actual rate. (Result-neutral: Nix's 7.4 vs Mahomes' 22.7 is variance, not the mechanism.)
