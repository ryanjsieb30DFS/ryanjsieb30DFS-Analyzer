    codified_in: "framework.md — Pre-lock checks (no-K-no-DST is a choice, a rate across the set; user approved 2026-09-19)"
    retired_reason: null

  - id: nfl_sd_kicker_conditional
    born: "2026-09-10"
    origin: "ETR research digest 9/10/26 — docs/etr_research/DIGEST_2026-09-10_nfl_sd.md (ETR kicker study 2020–25); external data, not a logged slate"
    statement: >
      The kicker edge exists in DOME games and when the vendor sheet shows the kicker under-owned; the outdoor close-spread underdog kicker is NOT an edge (0 for 2: Zvada 4.0, Lutz 4.0; the one confirmation, Pineiro 11.0, was a roofed stadium). NARROWED 2026-09-19 (user approved) from "close spread OR dome OR under-owned".
    status: validated
    confirmations:
      - date: "2026-09-11"
        history: "rules/nfl_sd/history/2026-09-11__nfl-sd-9-10-26"
        note: "Roofed stadium (Melbourne) + 3.5-point spread: underdog kicker Pineiro ($4,800) scored 11.0 and sat in 6 of the Dimeback top ten; favorite's kicker Mevis ($5,000) scored 1.0. Ownership was even (21.3% vs 21.1%), so the environment half confirmed and the under-owned half was untested."
