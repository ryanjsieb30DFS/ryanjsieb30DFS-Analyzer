  - id: nfl_sd_qb_cpt_under_base_rate
    born: "2026-09-11"
    origin: "rules/nfl_sd/history/2026-09-11__nfl-sd-9-10-26"
    statement: >
      When a quarterback's projected captain ownership sits well under the ~20% base rate at which a QB is the optimal captain, that QB is UNDER-picked leverage and belongs on the strategy's captain menu — the framework line "the field over-captains the QB" is a check, not a given. Why: the 1.5x multiplier buys nothing, so captain value is ceiling times (1 minus ownership); a QB with a top-3 ceiling at 6% captain ownership is the cheapest access to the slate's top score. Origin: Purdy 6.4% captain (ceiling 29.0, third on the sheet) scored 33.15 as captain and won BOTH contests; the strategy's captain menu named Adams (5.6 pts), Evans and Williams and omitted Purdy. Counts as confirmed when: on a logged slate a QB captained under ~10% is the winning captain or in the top-10 at/above his captain share.
    status: codified
    confirmations:
      - date: "2026-09-14"
        history: "rules/nfl_sd/history/2026-09-14__nfl-sd-snf-week-1-9-13-2026"
        note: "Applied AND held: the strategy checked both QBs against the 20% base rate (Dart 13.3% projected CPT, Dak 13.8%) and put both on the captain menu. Dart (ceiling 28.5 CPT, second on the sheet) went 18.8% actual captain ownership, scored 39.9 as captain and won BOTH contests. Mechanism confirmed; the ~10% threshold in the test line was not met (18.8%), so the lesson's bar is 'under the 20% base rate', not under 10%."
      - date: "2026-09-21"
        history_dir: "rules/nfl_sd/history/2026-09-21__nfl-sd-week-2-snf-9-21-2026"
        note: "Applied (edge 2: Mahomes 13.3% projected captain vs 69.3% flex, under the 20% base rate, on the captain menu) and the mechanism held: Mahomes was the slate's top raw score (31.98) and 47.97 as captain, the best captain score on the board (Taylor 43.8, Kelce 42.15, Walker 40.2). The test line's 'winning captain' half was missed for a salary reason, not a ceiling reason: CPT Mahomes ($15,000) + Taylor + Walker + Kelce + Butker + Thornton costs $51,600, so the 77 winners captained Kelce ($9,300) to hold all four top scorers. The user captained Mahomes in 4 of 20 (best 21.8%, sunk by Pierce 2.1). Third confirming slate (origin 9/10 + 9/13 + 9/21) — codification proposed 9/21 with the salary caveat (the QB's cheapest-captained top catcher is the same bet when the QB cannot fit)."
    contradictions: []
    codified_in: "framework.md — The captain decision (QB under the 20% base rate belongs on the captain menu; when he cannot fit, his cheapest-captained top catcher is the same bet; user approved 2026-09-21)"
    retired_reason: null
    # 2026-09-15: NOT applied, untested. Both QBs sat under the 20% base rate (Mahomes 13.6% projected captain, Nix 13.1%) but the strategy kept them OFF the captain menu ("keeps the quarterbacks as normal players") because they were among the crowd's top four captains. Cost nothing: the winner captained RB Walker (55.65 CPT); Mahomes as captain (33.99) tops out near the user's 120th-place score, Nix (11.16) nowhere. Neither confirms nor contradicts.

  - id: nfl_sd_cheap_side_catchers
    born: "2026-09-11"
    origin: "rules/nfl_sd/history/2026-09-11__nfl-sd-9-10-26"
    statement: >
      When the field's cheap fillers lean one team (that side's TE/RB2/DST at 20-30% each because the chalk stars leave ~$4,300 per remaining slot), the OTHER side's $7K-$8K pass-catchers under 20% ownership are the leverage set — regardless of which team wins. Why: a competitive-game script scores both sides, but only one side is cheap to own; the low-owned side's catchers carry the same points at a fraction of the duplication. Origin: Rams fillers Ferguson/Parkinson/Corum (24.3/20.9/29.5% owned) scored 0.0/2.4/5.4 while 49ers catchers Deebo/Evans/Robinson (17.5/27.7/4.8%) scored 18.0/16.9/13.0; the strategy surfaced the writers' 49ers-side read (edge 5) but left Deebo in Okay and Stafford in Good. Counts as confirmed when: the un-crowded side's mid-priced catchers out-average the crowded side's fillers on a logged slate with a spread under 7.
    status: retired
    confirmations: []
    contradictions:
      - date: "2026-09-21"
        history_dir: "rules/nfl_sd/history/2026-09-21__nfl-sd-week-2-snf-9-21-2026"
        note: "Triggered under its exact conditions and FAILED: spread 6.5 (under 7), the cheap side was the Chiefs (Butker 30.8%, Chiefs DST 32.1%, Kelce 42.0%, Worthy 37.9% actual) and the strategy's edge 9 named it, so the leverage set was the Colts' $7K-$8K catcher under 20%: Pierce ($7,600, 20.45% actual). Pierce scored 2.1; the crowded side's fillers scored Kelce 28.1, Butker 17.0, Worthy 13.5, Chiefs DST 1.0 (average 14.9). The premise ('the low-owned side carries the same points') fails because the fillers are crowded on the side Vegas expects to score, and that side did. Applied by the strategy and it cost: Pierce rode 9 of 20 entries (45%). Retirement proposed 9/21 (stale after 3 slates; the 9/15 caution — crowded filler Engram 14.3 was the definer — points the same way)."
    codified_in: null
    retired_reason: "Under its own conditions on 9/21 the quiet side's catcher (Pierce 2.1) lost to the crowded fillers (Kelce 28.1, Butker 17.0); the crowded side is crowded because the favorite scores. Stale after 3 slates. User approved 2026-09-21."
    # 2026-09-14: did not trigger — the cheap fillers split both ways (Flournoy/Aubrey/Demercado DAL, Tracy/Johnson NYG), so no side was 'the cheap side'.
    # 2026-09-15: did not trigger — the cheap side WAS Denver (Bryant 22.9%, Engram 17.5%; strategy edge 8 said so), but the Chiefs had no $7K-$8K catcher under 20% (Kelce $7,000 34.5%, Worthy $6,600 23.0%), so the lesson's leverage set did not exist. Caution for the premise: the crowded side's filler Engram (14.3) was the slate definer, and the quiet side's cheap pieces (Thornton 0.0, Gray) did nothing.

  - id: nfl_sd_pick_override_inside_band
    born: "2026-09-11"
    origin: "rules/nfl_sd/history/2026-09-11__nfl-sd-9-10-26"
    statement: >
      A pick rationale that overrides a strategy SHAPE rule (salary left, team split, captain-plus-teammates check) by citing a sim gap INSIDE the noise band loses the override; the shape rule is winner-data prior the sim's chance-to-win ranking does not carry when its correlation with real scores is ~0.2. Why: at 0.19 correlation and a ±0.4-point band, "best row on the table" is a coin-flip among ~10 rows, while the shape rules separate winners from fish at 2-to-1 rates. Origin: the Dimeback pick took the 5.33% top row, overrode the "leave salary" rule and failed the WR-captain+≤1-teammate check (5-1 Rams), then beat only 22.4% of the pool with 401 of 500 table rows above it; the Huddle pick overrode the 2-4 shape for a 3-3. 0 for 2. Counts as confirmed when: a logged pick that writes "trusted the sim over the strategy" on a sub-band gap finishes below the pool median.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null
    # 2026-09-14: untested — no Claude pick this slate (both entries hand-entered; no lineup_selection.json archived). The sim's chance-to-win metric again read weak (0.145 vs real scores), cash% read best (0.278).
    # 2026-09-15: untested — no Claude pick again (all 5 entries hand-entered from the Sim pool; no lineup_selection.json archived). Sim signal watch: chance-to-finish-first vs real scores 0.19 -> 0.145 -> 0.101 across three slates; cash chance led on 9/14 (0.278) and 9/15 (0.252) but trailed on 9/11 (0.137); chance-to-win-outright is under 0.1 two slates running (0.079, 0.051). Not a lesson yet.
    # 2026-09-21: untested — no Claude pick for the third slate running (all 20 hand-entered; no lineup_selection.json). KEEP: the pick flow exists, it has simply not been used on an NFL SD slate. Sim signal watch (10,150-row pool): cash chance 0.63 led for the third slate running (0.278, 0.252, 0.63); top-1% chance recovered to 0.255; ROI 0.429; chance-to-win-outright 0.12, near zero for the third slate (0.079, 0.051, 0.12). Read: the sim is a threshold, not a ranking — blend weights stay untouched by rule (CLAUDE.md: never re-tune on correlation-with-score). Pool held the exact winner (159.73) for the first time; 580 of 10,150 rows (5.7%) beat the user's best entry; the set beat the pool average by 4.28 points.

  - id: nfl_sd_underweight_across_entries
    born: "2026-09-11"
    origin: "rules/nfl_sd/history/2026-09-11__nfl-sd-9-10-26"
    statement: >
      An UNDERWEIGHT call is judged across EVERY entry on the slate, not per contest: "this is a single entry so he is not in every bullet" is void when the same player rides every contest's pick. Why: underweight means less exposure than the crowd; two single-entry contests both carrying the player is 100% exposure against the crowd's 24%, the opposite of the call. Origin: Ferguson (UNDERWEIGHT, 24.3% owned) was in 2 of 2 entries with that exact defense written in both rationales, and scored 0.0. Counts as confirmed when: a logged slate's under-own call rides every entry across contests and the player finishes below his salary tier.
    status: validated
    confirmations:
