    origin: "ETR research digest 9/10/26 — docs/etr_research/DIGEST_2026-09-10_nfl_sd.md (ETR 2025 sim study); external data, not a logged slate"
    statement: >
      The WINNING captain sits in the 5–25% projected-ownership band; sub-5% captains fill top-10 spots but have not won. Why: a sub-5% captain needs the slate's top raw score AND the right five around him, so he reaches the top ten far more often than first place. Counts as confirmed when: a logged contest's winning captain sits in the 5–25% band (sub-5% captains in the top ten neither confirm nor contradict). NARROWED 2026-09-14 (user approved) from "sub-5% captains underperform the band" after that half failed on both logged slates; evidence reset to the two winners.
    status: codified
    confirmations:
      - date: "2026-09-11"
        history: "rules/nfl_sd/history/2026-09-11__nfl-sd-9-10-26"
        note: "Winner captained QB Purdy at 6.7% (33.15 CPT) — inside the band. Sub-5% captains Deebo (2.0%) and Robinson (0.2%) took 4 of 10 Dimeback top-ten spots and the user's sub-5% captain Evans (4.9%) scored 38.0 CPT, none won."
      - date: "2026-09-14"
        history: "rules/nfl_sd/history/2026-09-14__nfl-sd-snf-week-1-9-13-2026"
        note: "Winner of both contests captained QB Dart at 18.8% (39.9 CPT) — inside the band. Sub-5% captains Likely (4.95%, 41.7 CPT) and Singletary (~0.2%) held 8 of 10 Dimeback top-ten spots and won 0 of 4 contests."
