# Lesson ledger — one entry per generalizable lesson. Claude edits during the
# post-autopsy review; the user approves codifications/retirements.
# Lifecycle: hypothesis -> validated -> codified | retired.
# Promotion: 3 mechanism confirmations -> propose codifying into framework.md.
# Retirement: 2 mechanism contradictions -> propose retiring.
# GPP guard: a lost contest is NOT a contradiction; only mechanism failures count.
lessons:
  # ---- 2026-09-10 — ETR NFL Showdown research digest (external, pre-season) ----

  - id: nfl_sd_cpt_rb_lean
    born: "2026-09-10"
    origin: "ETR research digest 9/10/26 — docs/etr_research/DIGEST_2026-09-10_nfl_sd.md (ETR 2025 Wildcat/Field General sim study (33 slates)); external data, not a logged slate"
    statement: >
      RB captains beat their projection more often than any other position; TE captains are the weakest. Why: RB usage (carries + targets) is stickier week to week than a receiver's target share, so the RB ceiling is reached more often. Counts as confirmed when: on a logged slate, RB captains appear in top-10 finishes at or above their share of the captain pool.
    status: retired
    confirmations: []
    contradictions:
      - date: "2026-09-11"
        history: "rules/nfl_sd/history/2026-09-11__nfl-sd-9-10-26"
        note: "RB captains were 1 of 10 (Dimeback) and 2 of 10 (Huddle) top-ten captains against ~30% of the captain pool (McCaffrey 20.5% + Williams 8.2% + Corum). Winners captained QB Purdy (33.15 CPT); McCaffrey scored 13.8 flex. One slate — mechanism not yet retired."
      - date: "2026-09-14"
        history: "rules/nfl_sd/history/2026-09-14__nfl-sd-snf-week-1-9-13-2026"
        note: "Second slate: RB captains were 2 of 10 (Dimeback: Skattebo 5th, Singletary 4th) and 3 of 10 (Huddle: Williams 3rd, Skattebo 4th x2) top-ten captains against ~30% of the captain pool (Williams 22.4% + Skattebo 6.3% + Tracy/Singletary/Demercado). Winners captained QB Dart (39.9 CPT); 7 of 10 Dimeback top-ten captains were TE Likely. Williams CPT beat his 26.9 CPT projection (36.3); Skattebo missed his (21.15 vs 21.75). Two contradictions of the top-10 test — retirement/narrowing proposed 9/14."
    codified_in: null
    retired_reason: "RB captains sat below their ~30% share of the captain pool in the top ten on both logged slates (1-2 of 10 on 9/10, 2-3 of 10 on 9/14). User approved 2026-09-14."

  - id: nfl_sd_sub5_cpt_leak
    born: "2026-09-10"
    origin: "ETR research digest 9/10/26 — docs/etr_research/DIGEST_2026-09-10_nfl_sd.md (ETR 2025 sim study); external data, not a logged slate"
    statement: >
      The WINNING captain sits in the 5–25% projected-ownership band; sub-5% captains fill top-10 spots but have not won. Why: a sub-5% captain needs the slate's top raw score AND the right five around him, so he reaches the top ten far more often than first place. Counts as confirmed when: a logged contest's winning captain sits in the 5–25% band (sub-5% captains in the top ten neither confirm nor contradict). NARROWED 2026-09-14 (user approved) from "sub-5% captains underperform the band" after that half failed on both logged slates; evidence reset to the two winners.
    status: hypothesis
    confirmations:
      - date: "2026-09-11"
        history: "rules/nfl_sd/history/2026-09-11__nfl-sd-9-10-26"
        note: "Winner captained QB Purdy at 6.7% (33.15 CPT) — inside the band. Sub-5% captains Deebo (2.0%) and Robinson (0.2%) took 4 of 10 Dimeback top-ten spots and the user's sub-5% captain Evans (4.9%) scored 38.0 CPT, none won."
      - date: "2026-09-14"
        history: "rules/nfl_sd/history/2026-09-14__nfl-sd-snf-week-1-9-13-2026"
        note: "Winner of both contests captained QB Dart at 18.8% (39.9 CPT) — inside the band. Sub-5% captains Likely (4.95%, 41.7 CPT) and Singletary (~0.2%) held 8 of 10 Dimeback top-ten spots and won 0 of 4 contests."
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_sd_three_three_default
    born: "2026-09-10"
    origin: "ETR research digest 9/10/26 — docs/etr_research/DIGEST_2026-09-10_nfl_sd.md (ETR 2025 sim study); external data, not a logged slate"
    statement: >
      3-3 builds without a named game script underperform 5-1, 1-5, and 4-2 builds that have one. Why: a single NFL game resolves to one side more often than it splits evenly. Counts as confirmed when: the slate's top-10 lineups are unbalanced (4-2 or wider) more often than 3-3.
    status: codified
    confirmations:
      - date: "2026-09-11"
        history: "rules/nfl_sd/history/2026-09-11__nfl-sd-9-10-26"
        note: "Top-10 lineups were 4-2 or wider in 8 of 10 (Dimeback: 5-1 x2, 4-2 x6, 3-3 x2) and 7 of 10 (Huddle). The Dimeback winner was 5-1 toward the 49ers. The user's 3-3 Huddle pick (which overrode the strategy's 2-4 shape citing the sim) finished 389th."
      - date: "2026-09-14"
        history: "rules/nfl_sd/history/2026-09-14__nfl-sd-snf-week-1-9-13-2026"
        note: "Huddle top-10 unbalanced 6 of 10 (2-4 x5, 4-2 x1) vs 3-3 x4; Dimeback a 5-5 tie (2-4 x4, 4-2 x1, 3-3 x5). The top 3 in BOTH contests were 2-4 toward the Giants (the 17.9%-of-field shape the strategy flagged as under-built). The user's 2-4 Huddle entry (CPT Skattebo) beat 63.8% of the field; the user's 3-3 Dimeback entry (CPT Williams) beat 22.8%. Counted as the second confirmation with the Dimeback tie noted — third confirming slate, codification proposed 9/14."
    contradictions: []
    codified_in: "framework.md — Pre-lock checks (3-3 must name its story; user approved 2026-09-14)"
    retired_reason: null

  - id: nfl_sd_six_skill_default
    born: "2026-09-10"
    origin: "ETR research digest 9/10/26 — docs/etr_research/DIGEST_2026-09-10_nfl_sd.md (ETR 2025 sim study); external data, not a logged slate"
    statement: >
      Lineups with no kicker and no DST underperform lineups that carry one or both. Why: K and DST are the highest-scoring pieces in their salary tier and force the lineup to state a script. Counts as confirmed when: the slate's top-10 lineups carry a K or DST more often than the user's entries did.
    status: validated
    confirmations:
      - date: "2026-09-11"
        history: "rules/nfl_sd/history/2026-09-11__nfl-sd-9-10-26"
        note: "6 of 10 top-ten lineups in EACH contest carried a K or DST (Pineiro 11.0 pts, 49ers DST) vs the user's 0 of 2. Caveat: both first-place lineups were six skill players with no K/DST — the edge is a rate, never a quota."
    contradictions:
      - date: "2026-09-14"
        history: "rules/nfl_sd/history/2026-09-14__nfl-sd-snf-week-1-9-13-2026"
        note: "Mechanism failed: 0 of 10 top-ten lineups in EITHER contest carried a K or DST while the user carried Zvada (4.0 pts) in 2 of 2. All four K/DST pieces busted (Aubrey 2.0 at 34% owned, Zvada 4.0, Cowboys DST 3.0, Giants DST 3.0) and the 'highest-scoring piece in its tier' was Singletary ($1,400, 13.8) and Likely ($6,400, 27.8) instead. 1 confirmation, 1 contradiction — stays validated, not promoted."
    codified_in: null
    retired_reason: null

  - id: nfl_sd_kicker_conditional
    born: "2026-09-10"
    origin: "ETR research digest 9/10/26 — docs/etr_research/DIGEST_2026-09-10_nfl_sd.md (ETR kicker study 2020–25); external data, not a logged slate"
    statement: >
      The kicker edge exists only in dome games, close spreads (the underdog kicker), or when the kicker is under-owned; blanket kicker use is neutral since 2025. Why: the field and DK pricing caught up to the old kicker discount; what is left is environment- and ownership-specific. Counts as confirmed when: a dome or close-spread kicker out-scores his salary tier on a logged slate while owned below the favorite's kicker.
    status: validated
    confirmations:
      - date: "2026-09-11"
        history: "rules/nfl_sd/history/2026-09-11__nfl-sd-9-10-26"
        note: "Roofed stadium (Melbourne) + 3.5-point spread: underdog kicker Pineiro ($4,800) scored 11.0 and sat in 6 of the Dimeback top ten; favorite's kicker Mevis ($5,000) scored 1.0. Ownership was even (21.3% vs 21.1%), so the environment half confirmed and the under-owned half was untested."
      - date: "2026-09-14"
        history: "rules/nfl_sd/history/2026-09-14__nfl-sd-snf-week-1-9-13-2026"
        note: "PARTIAL, not counted: outdoors, 2.5-point spread, underdog kicker Zvada ($4,800) owned 11.8% vs Aubrey's 34.3%. Direction held (Zvada 4.0 beat Aubrey 2.0) but Zvada did NOT out-score his salary tier (Fields $5,000 4.5, Mooney $4,000 4.7) and 0 of 20 top lineups carried any kicker. The edge was real but worth nothing."
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_sd_dupe_over_sim
    born: "2026-09-10"
    origin: "ETR research digest 9/10/26 — docs/etr_research/DIGEST_2026-09-10_nfl_sd.md (ETR 2025 sim study); external data, not a logged slate"
    statement: >
      At similar sim ROI, the lineup with fewer projected duplicates wins on actual return. Why: an 11x-duplicated cash returns about 60% less than a unique cash. Counts as confirmed when: a logged contest's top finishers with positive sim ROI were low-dupe more often than high-dupe.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null
