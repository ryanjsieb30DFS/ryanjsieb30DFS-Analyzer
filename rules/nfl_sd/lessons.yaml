  - id: nfl_sd_dupe_over_sim
    born: "2026-09-10"
    origin: "ETR research digest 9/10/26 — docs/etr_research/DIGEST_2026-09-10_nfl_sd.md (ETR 2025 sim study); external data, not a logged slate"
    statement: >
      At similar sim ROI, the lineup with fewer projected duplicates wins on actual return. Why: an 11x-duplicated cash returns about 60% less than a unique cash. Counts as confirmed when: a logged contest's top finishers with positive sim ROI were low-dupe more often than high-dupe.
    status: retired
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: "Untestable: the archive never holds sim ROI for the field's top finishers (3 slates). Content already codified in framework.md Duplication (a 15% sim-ROI lineup with 2 dupes beats a 20% lineup with 10). User approved 2026-09-19."
    # 2026-09-11: untested — the archive holds no per-lineup sim ROI for the top finishers. Top-10 dupe counts were 1-3 in both contests.
    # 2026-09-14: untested again (same gap). Winner copied 2-3x, top-20 dup_max 11 (Dimeback) / 17 (Huddle).
    # 2026-09-15: untested a third time — the archive can never hold sim ROI for the FIELD's top finishers, so the test as written cannot fire. The slate still showed the payout side: 84 identical lineups tied for first at 124.61 and split places 1-84 for about $1,240 each instead of $50,000. Retirement proposed 9/15 (the content already lives in framework.md's Duplication section).

