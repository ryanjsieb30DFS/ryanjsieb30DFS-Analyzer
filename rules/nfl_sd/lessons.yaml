  - id: nfl-sd-2026-09-21-dog-passing-over-exposure
    born: "2026-09-21"
    origin: "rules/nfl_sd/history/2026-09-21__nfl-sd-week-2-snf-9-21-2026"
    statement: >
      In a 6.5-point-or-wider spread the underdog's pass-catchers are the bust cluster, and the set over-holds them because the "loser throws late" (garbage-time) and upset stories get more entries than the framework's ~18% + ~8% share and each of those entries stacks three or four underdog catchers. Why: the garbage-time script needs the favorite to lead AND the underdog to keep throwing well; the busts come from the second half failing (Jones 12.4 on 34 dropbacks), and every entry built on that story carries all of the underdog's catchers at once, so exposure to each one doubles the field's. Origin: Pierce ($7,600, 2.1) rode 9 of 20 entries (45%) vs the field's 20.4%, Downs (14.2) 8 of 20 (40%) vs 22.4%, Jones (12.4) 7 of 20 (35%) vs 32.6%, Warren (14.4) 9 of 20 (45%) vs 38.3%; the bottom six entries of the set were the six Colts-tilted stories; Jones/Pierce/Allen sat in 49%/34%/33% of the bottom half and 0% of the top 1%. Prior sighting 9/14: the busts were Nix 7.4, Sutton 3.1, Waddle 1.2 (the losing side's passing game) with bust exposure 80%; the four-slate trend is 75%, 40%, 80%, 100%. Counts as confirmed when: on a logged 6.5+ spread slate the underdog's catchers finish as the bust cluster AND the user's exposure to them sits above the field's actual rate. Counts as contradicted when: the underdog's catchers out-score the favorite's fillers on a 6.5+ spread (the upset), or the set holds them under the field's rate and still busts.
    status: hypothesis
    confirmations: []
    contradictions: []
