  # ---- 2026-09-11 — NFL SD 9.10.26 (49ers at Rams, Melbourne) — first logged slate ----

  - id: nfl_sd_qb_cpt_under_base_rate
    born: "2026-09-11"
    origin: "rules/nfl_sd/history/2026-09-11__nfl-sd-9-10-26"
    statement: >
      When a quarterback's projected captain ownership sits well under the ~20% base rate at which a QB is the optimal captain, that QB is UNDER-picked leverage and belongs on the strategy's captain menu — the framework line "the field over-captains the QB" is a check, not a given. Why: the 1.5x multiplier buys nothing, so captain value is ceiling times (1 minus ownership); a QB with a top-3 ceiling at 6% captain ownership is the cheapest access to the slate's top score. Origin: Purdy 6.4% captain (ceiling 29.0, third on the sheet) scored 33.15 as captain and won BOTH contests; the strategy's captain menu named Adams (5.6 pts), Evans and Williams and omitted Purdy. Counts as confirmed when: on a logged slate a QB captained under ~10% is the winning captain or in the top-10 at/above his captain share.
    status: validated
    confirmations:
      - date: "2026-09-14"
        history: "rules/nfl_sd/history/2026-09-14__nfl-sd-snf-week-1-9-13-2026"
        note: "Applied AND held: the strategy checked both QBs against the 20% base rate (Dart 13.3% projected CPT, Dak 13.8%) and put both on the captain menu. Dart (ceiling 28.5 CPT, second on the sheet) went 18.8% actual captain ownership, scored 39.9 as captain and won BOTH contests. Mechanism confirmed; the ~10% threshold in the test line was not met (18.8%), so the lesson's bar is 'under the 20% base rate', not under 10%."
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_sd_cheap_side_catchers
    born: "2026-09-11"
    origin: "rules/nfl_sd/history/2026-09-11__nfl-sd-9-10-26"
    statement: >
      When the field's cheap fillers lean one team (that side's TE/RB2/DST at 20-30% each because the chalk stars leave ~$4,300 per remaining slot), the OTHER side's $7K-$8K pass-catchers under 20% ownership are the leverage set — regardless of which team wins. Why: a competitive-game script scores both sides, but only one side is cheap to own; the low-owned side's catchers carry the same points at a fraction of the duplication. Origin: Rams fillers Ferguson/Parkinson/Corum (24.3/20.9/29.5% owned) scored 0.0/2.4/5.4 while 49ers catchers Deebo/Evans/Robinson (17.5/27.7/4.8%) scored 18.0/16.9/13.0; the strategy surfaced the writers' 49ers-side read (edge 5) but left Deebo in Okay and Stafford in Good. Counts as confirmed when: the un-crowded side's mid-priced catchers out-average the crowded side's fillers on a logged slate with a spread under 7.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null
    # 2026-09-14: did not trigger — the cheap fillers split both ways (Flournoy/Aubrey/Demercado DAL, Tracy/Johnson NYG), so no side was 'the cheap side'.

  - id: nfl_sd_pick_override_inside_band
    born: "2026-09-11"
    origin: "rules/nfl_sd/history/2026-09-11__nfl-sd-9-10-26"
    statement: >
      A pick rationale that overrides a strategy SHAPE rule (salary left, team split, captain-plus-teammates check) by citing a sim gap INSIDE the noise band loses the override; the shape rule is winner-data prior the sim's chance-to-win ranking does not carry when its correlation with real scores is ~0.2. Why: at 0.19 correlation and a ±0.4-point band, "best row on the table" is a coin-flip among ~10 rows, while the shape rules separate winners from fish at 2-to-1 rates. Origin: the Dimeback pick took the 5.33% top row, overrode the "leave salary" rule and failed the WR-captain+≤1-teammate check (5-1 Rams), then beat only 22.4% of the pool with 401 of 500 table rows above it; the Huddle pick overrode the 2-4 shape for a 3-3. 0 for 2. Counts as confirmed when: a logged pick that writes "trusted the sim over the strategy" on a sub-band gap finishes below the pool median.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null
    # 2026-09-14: untested — no Claude pick this slate (both entries hand-entered; no lineup_selection.json archived). The sim's chance-to-win metric again read weak (0.145 vs real scores), cash% read best (0.278).

  - id: nfl_sd_underweight_across_entries
    born: "2026-09-11"
    origin: "rules/nfl_sd/history/2026-09-11__nfl-sd-9-10-26"
    statement: >
      An UNDERWEIGHT call is judged across EVERY entry on the slate, not per contest: "this is a single entry so he is not in every bullet" is void when the same player rides every contest's pick. Why: underweight means less exposure than the crowd; two single-entry contests both carrying the player is 100% exposure against the crowd's 24%, the opposite of the call. Origin: Ferguson (UNDERWEIGHT, 24.3% owned) was in 2 of 2 entries with that exact defense written in both rationales, and scored 0.0. Counts as confirmed when: a logged slate's under-own call rides every entry across contests and the player finishes below his salary tier.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null
    # 2026-09-14: did not trigger — all three UNDERWEIGHT calls (Aubrey 2.0, Flournoy 4.2, Tracy 0.4) were at 0 of 2 entries. The opposite discipline held; nothing to test.

  # ---- 2026-09-14 — NFL SD SNF Week 1 9.13.26 (Cowboys at Giants) — second logged slate ----

  - id: nfl_sd_qb_catcher_captain
    born: "2026-09-14"
    origin: "rules/nfl_sd/history/2026-09-14__nfl-sd-snf-week-1-9-13-2026"
    statement: >
      When a quarterback is on the captain menu, his primary pass-catcher belongs on it too whenever that catcher's captain ownership sits under ~5% — the catcher is the cheaper route to the same passing-game ceiling. Why: on every completed pass the catcher scores more than the thrower (the framework's own line), so a QB captained at 13-19% and his top target captained at 3-5% are the same bet at a third of the ownership; the sheet's captain ceiling for the catcher (Likely 17.4 flex → 26.1 CPT) under-states a 2-touchdown night because TE ceilings are touchdown-driven. Origin: Likely ($6,400, 3.0% projected / 4.95% actual captain) scored 27.8 flex and 41.7 as captain — the slate's top raw scorer — and was 7 of the 10 Dimeback top-ten captains and 6 of 10 in the Huddle; the strategy's menu carried Dart (18.8%), Nabers (6.4%) and Skattebo but not Likely, whom it tiered Good at rank 8 with Silva's own line that he "could lead this game in receiving." Same shape on 9/10: Purdy's catcher Deebo captained the 3rd-place Dimeback lineup at 2.0%. Counts as confirmed when: on a logged slate a sub-5%-captained primary catcher of a menu QB lands in the top-10 captains at or above his captain share.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_sd_punt_slot_role_path
    born: "2026-09-14"
    origin: "rules/nfl_sd/history/2026-09-14__nfl-sd-snf-week-1-9-13-2026"
    statement: >
      The cheap sixth spot (the punt slot) is judged by a role path, not by the sheet's ceiling: a sub-$2,500 player's ceiling number is the sheet's median-plus-noise, while one short touchdown is 6+ points on a 2-3 point projection, so a min-priced back with a documented path to goal-line touches (a back or two out) can score 1.5-2x his printed ceiling. Why: the field fills this slot by following the same projections, so it converges on the highest-PROJECTED cheap piece (Johnson 4.2 proj at 19.2% owned, Demercado 14.7% after the Davis injury news) — the punt slot is where the field is most copied and where a same-price alternative with a role path is the cheapest leverage on the slate. Origin: Singletary ($1,400, 3.2% owned, projected 2.7, ceiling 7.7) scored 13.8 with Najee Harris inactive, was the winner's only sub-5% piece and sat in 40-45% of the top-20 in both contests; the user's punt slots held Beckham (9.4%, 0.0) and Johnson (19.2%, 1.9). The strategy addressed Singletary in one Leverage line and the board ranked him 23rd. Counts as confirmed when: a logged slate's winner carries a sub-$2,500 piece with a stated role path that the sheet projected under 3 points, and the field's crowded cheap filler scores under its projection.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_sd_winner_envelope_45_per_slot
    born: "2026-09-14"
    origin: "rules/nfl_sd/history/2026-09-14__nfl-sd-snf-week-1-9-13-2026"
    statement: >
      In ~2,000-entry single-entry Showdowns the winning ownership envelope is about 45% per roster spot (four chalk stars + one mid-priced piece + one sub-5% dart), not the framework's ~28% per slot; an entry under 40% per slot is under-owning the chalk, not being sharp. Why: the Showdown universe is ~30 names and the top five sit at 45-74% each, so any lineup holding four of them averages ~45%; winners differentiate by WHICH captain wears the tag and by the one cheap dart, not by fading stars. Origin: top-20 average ownership per spot was 47.0% (Dimeback) and 45.6% (Huddle), the winner 46.8%, the four tracked pros 42.0%, while the strategy set a 28-30% target and both user entries sat at 39.4% and 40.0% — below every winning cohort. Counts as confirmed when: a logged ~1,500-2,500-entry SE slate's top-20 averages 40%+ per slot while the strategy's stated target stays under 35%.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null
