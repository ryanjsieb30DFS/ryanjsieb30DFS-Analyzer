  - id: nfl_sd_kicker_conditional
    born: "2026-09-10"
    origin: "ETR research digest 9/10/26 — docs/etr_research/DIGEST_2026-09-10_nfl_sd.md (ETR kicker study 2020–25); external data, not a logged slate"
    statement: >
      The kicker edge exists in DOME games and when the vendor sheet shows the kicker under-owned; the outdoor close-spread underdog kicker is NOT an edge (0 for 2: Zvada 4.0, Lutz 4.0; the one confirmation, Pineiro 11.0, was a roofed stadium). NARROWED 2026-09-19 (user approved) from "close spread OR dome OR under-owned".
    status: validated
    confirmations:
      - date: "2026-09-11"
        history: "rules/nfl_sd/history/2026-09-11__nfl-sd-9-10-26"
        note: "Roofed stadium (Melbourne) + 3.5-point spread: underdog kicker Pineiro ($4,800) scored 11.0 and sat in 6 of the Dimeback top ten; favorite's kicker Mevis ($5,000) scored 1.0. Ownership was even (21.3% vs 21.1%), so the environment half confirmed and the under-owned half was untested."
      - date: "2026-09-14"
        history: "rules/nfl_sd/history/2026-09-14__nfl-sd-snf-week-1-9-13-2026"
        note: "PARTIAL, not counted: outdoors, 2.5-point spread, underdog kicker Zvada ($4,800) owned 11.8% vs Aubrey's 34.3%. Direction held (Zvada 4.0 beat Aubrey 2.0) but Zvada did NOT out-score his salary tier (Fields $5,000 4.5, Mooney $4,000 4.7) and 0 of 20 top lineups carried any kicker. The edge was real but worth nothing."
    contradictions:
      - date: "2026-09-15"
        history: "rules/nfl_sd/history/2026-09-15__nfl-sd-week-1-mnf-9-14-2026"
        note: "Mechanism failed under its own conditions: outdoors, 2.5-point spread, underdog kicker Lutz ($5,200) owned 21.9% vs Butker's 27.1% — the close-spread AND under-owned halves both applied. Lutz scored 4.0 to Butker's 7.0, sat in 0% of the top-1% lineups and 25% of the bottom half (a fish trap), and did not out-score his tier (Chiefs DST $4,400 12.0). Outdoor close-spread underdog kickers are now 0 for 2 (Zvada 4.0, Lutz 4.0); the only confirmation (9/11) was a roofed stadium. Narrowing to the dome half proposed 9/15."
      - date: "2026-09-21"
        history_dir: "rules/nfl_sd/history/2026-09-21__nfl-sd-week-2-snf-9-21-2026"
        note: "First contradiction of the NARROWED statement: outdoors at Arrowhead, 6.5-point spread, neither kicker under-owned (Butker 27.4% / Shrader 23.8% projected, both two ranks ahead of their projection rank) — every 'no edge' condition applied, and both kickers topped their salary tier: Butker ($5,000) 17.0 vs Worthy $5,400 13.5 / Allen $5,600 1.5; Shrader ($4,600) 14.0 vs Chiefs DST $4,200 1.0 / Thornton $3,800 12.6. Butker sat in all 77 winning copies. The strategy APPLIED the lesson (both kickers UNDERWEIGHT citing 'outdoors, 0 for 2') and it cost: the user held Butker in 3 of 20 (15%) vs the field's 30.8%. Outdoor kickers are now 2 misses (9/13, 9/14) and 2 hits (9/21) — the environment clause does not predict. NOT promoted despite the 3-slate flag; a second outdoor hit retires the environment clause."
    codified_in: null
    retired_reason: null

