  - id: pga-classic-2026-07-22-dart-rate-exceeds-in-field-pros
    born: "2026-07-22"
    origin: "rules/pga_classic/history/2026-07-22__2026-open-championship — 2026 Open Championship (shark_gap.json leverage_pct delta +60)"
    statement: >
      In small-field 5-Max, my portfolios carry sub-5% pieces at a far HIGHER rate than
      the tracked in-field pros, and the extra darts are not buying anything: this
      slate 80% of my lineups carried a sub-5% piece vs the in-field pros' 20% (delta
      +60), and the same axis in the same direction was the top shark gap at Shinnecock
      (delta +53.3) — a recurring structural separation, not noise. Mechanism: in a
      ~3.5K-field 5-Max my 5 bullets are already 100% unique, so the marginal deep dart
      buys no needed uniqueness and only adds bust risk; meanwhile the actual
      slate-definers keep landing in the 8-19% mid-owned band (Young 8.7%, Burns 13.6%
      this slate — zero definers sub-5%), which is where the pros concentrate. The
      pros' edge is anchor discipline plus mid-band selection (in-field pros ran 20.1%
      own/slot and 0.6 chalk-anchor exposure vs my 16.5% / 0.4, and their best bullet
      beat mine 8.3 vs 23.5 pctile); mine spends the differentiation budget below 5%
      where the hit rate is thinnest. Guard: sub-5% exposure should be capped near the
      sharp-playbook "one sub-5% piece in MOST lineups" — not one in nearly every
      lineup plus extra — with the freed slots pushed up into the 8-19% definer band.
      Distinct from [[pga-classic-2026-06-13-dose-darts-to-course-variance]] (per-lineup
      dart COUNT vs course archetype) — this is the PORTFOLIO-level sub-5% rate vs the
      observed pro envelope.
    status: codified
    confirmations:
      - date: "2026-07-26"
        slate: "3M Open at TPC Twin Cities (rules/pga_classic/history/2026-07-26__pga-3m-open-2026)"
        note: >
          First confirmation of the recurring axis, with one prong narrowed. The
          axis fired a THIRD straight 5-Max: leverage_pct was again the top
          shark gap (100% of user lineups carried a sub-5% piece vs the in-field
          pros' 80% — delta +20 after +53.3 at Shinnecock and +60 at Birkdale),
          and the user again out-darted the winners (3.25 sub-10% per lineup vs
          the top-20's 2.55). The gap NARROWED and the doc drove it: the
          strategy applied this lesson in text ("keep ONE sub-5% dart in about
          half the bullets — not one-plus-extras in all of them"), and the best
          entry (3.4 pctile) spent its low-owned slots in the 5-10% band, not
