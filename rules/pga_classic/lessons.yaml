          never land sub-5%" is too strong — Chatfield (100.5 @ 3.94%, in 35% of
          top lineups) and the winner's carrier McCarthy (121.0 @ 2.68%) were
          genuine sub-5% definers here. The durable mechanism is the RATE gap vs
