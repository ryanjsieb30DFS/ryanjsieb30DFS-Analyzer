  - id: pga-classic-2026-07-26-unprojected-cheap-steam-screen
    born: "2026-07-26"
    origin: "rules/pga_classic/history/2026-07-26__pga-3m-open-2026 — 3M Open at TPC Twin Cities (Blair/James coverage hole)"
    statement: >
      On a single-vendor slate, the strategy must explicitly screen for the
      field's cheap-value STEAM tier — the salary-relief names the DK field
      floods regardless of what the vendor's ownership model says — because the
      vendor systematically under-projects that tier and the doc's whole
      trap/leverage map inherits the miss. At the 3M Open the 5th- and
      7th-most-owned players in the field, Benjamin James (19.1% actual own) and
      Zac Blair (17.0%), appeared NOWHERE in the strategy doc: ETR projected
      both low, so no section ever addressed them — yet James was the slate's #1
      fish trap (26.0% of fish lineups, 0.0% of winners, 31.0 FPTS) while Blair
      scored 103.0, made 30% of the top-20 winners, and formed the single most
      duplicated pair in the field (Scheffler+Blair, 10.5% of ALL lineups). One
      was the trap of the slate and one was a winner piece, and the doc could
      grade neither because neither existed in it. Mechanism: coffin lists, fade
      boards, chalk-combo tables, and the sub-10% definers screen are ALL keyed
      off PROJECTED ownership, so a name the vendor projects low that the field
      actually crowds to 15-25% bypasses every screen simultaneously.
      Supporting prior: Birkdale's Fitzpatrick steam (25.5% -> 37.6%).
      Expression: before writing Leverage & fades, list the plausible
      salary-relief/comfort names (panel steam mentions, "everyone will play X"
      quotes, the obvious cheap pairings a locked-in expensive anchor forces)
      and give each an explicit trap-vs-value read even when the vendor
      projects it under 10%. Partner of
      [[pga-classic-2026-06-17-single-vendor-overweight-self-erosion]] (drift on
      the vendor's NAMED overweights) — this covers the names the vendor never
      priced as owned at all.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: pga-classic-2026-07-26-underweight-is-not-zero-small-portfolio
    born: "2026-07-26"
    origin: "rules/pga_classic/history/2026-07-26__pga-3m-open-2026 — 3M Open at TPC Twin Cities (Matsuyama 0/4 near-miss)"
    statement: >
      In a 4-5 bullet portfolio, an UNDERWEIGHT call on top-skill contested
      chalk means at least one bullet, not zero. The only realizable exposure
      levels at N<=5 are 0/20-25/40-50%, so treating underweight as 0-of-N
      silently converts the doc's "own less than the field" into a full
      portfolio fade the analysis never argued — and the never-zero asymmetry
      (zero exposure when contested chalk hits costs far more than one bullet
      costs when it busts) applies with full force one tier below the anchor. At
      the 3M Open the doc graded Hideki Matsuyama UNDERWEIGHT as "genuinely
      contested" ~20% chalk with the #2 skill baseline; the entries took 0/4;
      adherence graded that "followed" (0% passes the <50% underweight gate);
      and Matsuyama hit 126.5, made 50% of the top-20 winners, anchored the
      contest winner — and the near-miss counterfactual shows the best entry
      WINS the contest outright on the single swap Im -> Matsuyama. Mechanism,
      not result: the adherence gate cannot distinguish underweight from zero
      at small N, so the discipline layer passes portfolios that structurally
      contradict the call; the fix is a floor, not a grade — an UNDERWEIGHT on
      a top-3-skill piece in a 4-5 bullet set means exactly one bullet.
      Partner of [[pga-classic-2026-05-11-never-zero-value-chalk-anchor]]
      (which covers the projection #1) — this extends the same asymmetry to
      contested top-skill chalk the doc itself declined to fade.
    status: validated
    confirmations:
      - date: "2026-08-03"
        slate: "Rocket Classic at Detroit Golf Club (rules/pga_classic/history/2026-08-03__rocket-classic-2026)"
        note: >
          First mechanism confirmation, and it exposes a SECOND blind spot in the
          adherence gate. The doc graded Cameron Young UNDERWEIGHT and spelled the
          floor out in the text ("Underweight is NOT zero: in a five-lineup set that
          means one bullet, per your never-zero rule"). The 5-Max Eagle entries then
          took Young 0 of 5 — the exact zero the doc argued against — while the
          20-lineup mini-MAX carried him 3 times. adherence.json pooled all 26
          lineups, reported 11.5% exposure, and graded the call "followed." So the
          gate passed a portfolio that zeroed the call in the FOCUS contest purely
          because a separate large-field contest covered it. Two gate failures now
          stack: (a) 0-of-N passes the <50% underweight test at small N (the 3M
          Matsuyama case), and (b) pooling contests hides a zero in the small-field
          contest behind exposure in the large one. Mechanism, not result — Young
          scored a survivable 87.0 at ~29.6% field own, so this slate the zero cost
          little; the finding is that the discipline layer cannot see the violation
          at all. Fix unchanged and now doubled: an UNDERWEIGHT call means exactly
          one bullet, and the floor must be checked PER CONTEST, not across the
          pooled entry set. Same slate, same gate, a converse measurement miss worth
          logging: the Nicolai Hojgaard UNDERWEIGHT call read 0 of 26 in
          adherence.json when he was in fact rostered in Eagle lineup 3 — the DK
          spelling carries a slashed-o Scandinavian character that the strategy
          doc's plain-ASCII spelling does not, and the name matcher missed it, so
          that call's grade was wrong in the opposite direction.
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: pga-classic-2026-08-03-equivalence-take-the-discounted-half
    born: "2026-08-03"
    origin: "rules/pga_classic/history/2026-08-03__rocket-classic-2026 — Rocket Classic at Detroit Golf Club (Gotterup 11/26 vs Xander 5/26)"
    statement: >
      The Anchor-Equivalence read is only cashed by rostering the LESS-OWNED half of
      the pair. Two players who are near-identical bets have near-identical points
      expectation by construction, so the entire edge of noticing the pair is the
      ownership discount — carrying the crowded half buys the same expected points at
      several times the duplication cost and captures none of the edge. Mechanism: the
      substitutability finding reads as permission ("either one is fine") when it is
      actually a directive on WHICH one, so exposure defaults to the more famous or
      higher-tiered name and the discount evaporates. At the Rocket Classic the
      strategy named TWO equivalence pairs — the crowded pair (Cameron Young 31.4% and
      Chris Gotterup 27.3% projected own, ceilings 116.6 and 113.4) and the discounted
      pair (Xander Schauffele 13.5% and Jackson Koivun 13.7%, near-equal DK win odds) —
      and stated the direction explicitly: "a sharp anchors most entries from the 13%
      side of that bet and lets the field pay 31%." The entered set then ran Gotterup on
      11 of 26 lineups (42%, the portfolio's largest exposure and above the framework's
      35% MME cap) against Xander 5 of 26 and Koivun 3 of 26. Structural outcome:
      Gotterup drew 26.7-29.7% actual field own and was the #1 fish trap in BOTH
      contests (47.1% of Eagle losers vs 0.0% of Eagle winners; 40.4% vs 0.4% in the
      mini-MAX), while Xander came in at 14.1-16.3% and appeared in 74% of the mini-MAX
      top-100 winners. Expression: when the strategy names an equivalence pair, write
      the exposure split in the same sentence, weighted to the lower-owned half, and
      check the built set against it before lock. Distinct from
      [[pga-classic-2026-05-11-never-zero-value-chalk-anchor]] (which says do not zero
      the crowded half) — this says do not let the crowded half become the largest
      exposure. Partner of
      [[pga-classic-2026-06-17-design-exposures-before-lineups]] (the mechanism by
      which an unstated preference wins slot competition).
