    origin: "rules/pga_classic/history/2026-07-22__2026-open-championship — 2026 Open Championship (off-screen darts Sullivan/Reed/Smith/Detry)"
    statement: >
      Dart slots must be filled FROM the strategy's written low-owned-definer screen,
      not improvised at build time: an off-screen dart is an unvetted coin flip that
      skipped the only filter (ceiling path + ownership) the process applies, while
