  - id: pga-classic-2026-08-03-core-tier-must-price-crowding
    born: "2026-08-03"
    origin: "rules/pga_classic/history/2026-08-03__rocket-classic-2026 — Rocket Classic (pool_calibration.json OUT OF ORDER, Gotterup tiered Core)"
    statement: >
      The player-pool board's Core tier must be gated on field crowding, not assigned
      on projected points and vendor edge alone, because a Core label drives exposure
      and therefore converts a tiering error directly into a duplication error.
      Mechanism: Core reads as "start here," so whatever sits in Core gets the
      portfolio's largest weight; if the field's most-crowded anchor can earn a Core
      label on projection strength, the board is instructing the builder to buy the
      crowd's position at the crowd's price, which is the opposite of what the tier is
      for. At the Rocket Classic the Core tier held three names (J.J. Spaun, Si Woo Kim,
      Chris Gotterup) and averaged 56.8 FPTS — BELOW Good (75.6) and below Okay (62.7),
      the first out-of-order board in three logged slates (Birkdale and the 3M both
      ordered) — because Gotterup carried a Core label at 26.7-29.7% actual field own,
      posted 27.5, and finished as the #1 fish trap in both contests. The two names the
      portfolio then hammered were the two reachable Core names (Gotterup 11 of 26, Si
      Woo 9 of 26). Secondary evidence that the tier edges are soft: five players tiered
      Fade out-scored the Core average (Davis Thompson 99.5, Ricky Castillo 88.0, Kevin
      Roy 88.0, Beau Hossler 67.5, Mark Hubbard 66.0), and Davis Thompson was a genuine
      slate-definer sitting at the bottom of the board. Proposed gate: no player inside
      the slate's top-3 projected-ownership tier is tiered Core unless the same line
      states the crowding tension and the duplication cost; and a three-name Core tier
      is too thin to be stable, so Core should carry 5-6 names and no single bust should
      be able to invert the board. Related to
      [[pga-classic-2026-05-17-trap-vs-value-chalk]] (which mis-sorted the same player
      upstream) — this is the downstream tiering expression of the same failure.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null
