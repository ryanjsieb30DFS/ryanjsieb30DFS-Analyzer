  - id: pga-classic-2026-07-01-vendor-independent-ceiling-scan
    born: "2026-07-01"
    origin: "rules/pga_classic/history/2026-07-01__travelers-2026 — Travelers Championship at TPC River Highlands (Hovland/Morikawa slate-definer blind spot)"
    statement: >
      The slate strategy must run a VENDOR-INDEPENDENT scan of the full elite/mid field
      for ceiling before writing Top plays, because building the doc off one vendor's
      coffin-overweight list (ETR) plus one panel show's named 'best plays' (ETG) is a
      narrow lens that systematically omits in-form studs who are not that vendor's
      leverage darlings. Mechanism: a coffin list surfaces optimal-minus-own GAPS and a
      panel surfaces its hosts' favorite plays — neither is a complete ceiling board, so
      elite players the vendor happens not to flag as leverage never enter the strategy at
      all. Born from the Travelers, where the two biggest scores on the slate — Viktor
      Hovland (144.0 @ 7.6-7.8% own, in 80-85% of winners) AND Collin Morikawa (124.0 @
      ~17.6-19.7%, in ~60-65% of winners) — are both top-25 OWGR elites, NOT obscure darts,
      yet neither appeared anywhere in the strategy doc because neither was an ETR coffin
      overweight or an ETG panel 'best play.' This is the FOURTH straight slate the actual
      slate-definer was outside the ETR-coffin/ETG-panel lens (Memorial: Poston/Cole; RBC:
      Fox/Yellamaraju; Shinnecock: Wyndham Clark; Travelers: Hovland/Morikawa/Bhatia/
      Hideki), and it produced the worst finish of the sample (98.3 / 99.7 pct) with zero
      of the six slate-definers rostered. Guard/expression: before writing Top plays,
      independently list the ~12-15 highest-ceiling players for the week from the
      projections + form (best ball-strikers / hottest approach numbers / elite anchors),
      REGARDLESS of whether ETR's coffin or the panel flagged them; then reconcile that
      board against the coffin/panel — every elite or mid player with a real ceiling gets
      an explicit PLAY/PASS with a mechanism, so no top-of-the-board stud is silently
      omitted. Encompasses the identification half of
      [[pga-classic-2026-06-17-mid-owned-value-spine-over-darts]], the single-vendor bubble
      of [[pga-classic-2026-06-17-single-vendor-overweight-self-erosion]], and the broadened
      [[pga-classic-2026-06-24-major-pedigree-in-form-leverage]]. MERGED IN 2026-07-22
      (from [[pga-classic-2026-06-24-major-pedigree-in-form-leverage]], per the Open
      Championship review): the scan's ceiling board MUST explicitly include recent
      tournament/major champions and proven closers gated on a current-form floor,
      flagging any that survive the gate at sub-15% projected own as leverage —
      pedigree without form stays lottery-only (Koepka). Both mechanisms fired through
      the same screen at Birkdale (Lowry, the in-form 2019 champ at 8.4%, hit 66.0;
      Young, the in-form links pedigree, hit 96.5).
    status: codified
    confirmations:
      - date: "2026-07-22"
        slate: "2026 Open Championship at Royal Birkdale (rules/pga_classic/history/2026-07-22__2026-open-championship)"
        note: >
          First mechanism confirmation — the scan was actually RUN and it worked. The
          strategy explicitly surfaced plays "named by no article" on ceiling alone:
          Hatton ($8.9K, 92.0 ceiling, above the sim-optimal line, "named by no article
          — vendor-independent-scan catch"), Wyndham Clark ("unflagged elsewhere"),
          J.J. Spaun ("zero article ink"), Ben Griffin ("named by no article — screen
          catch"). Result: for the FIRST time in five slates the actual slate-definer
          (Cameron Young, 96.5 @ 8.72%, the winner's carrier, in 44.4% of top lineups)
          was named in the doc pre-lock — the definer-outside-the-lens streak broke at
          the doc level. Residual gap that keeps the scan honest: Sam Burns (92.0 @
          13.6%, in 66.7% of the top-36 winners — the most common winner piece) still
          appeared NOWHERE in the doc; a mid-band elite the vendor was cool on is
          exactly what the "~12-15 highest-ceiling players regardless of vendor flags"
          board must include. Promote to validated; the Burns-shaped hole defines what
          a second confirmation must show (the full-field ceiling board catching the
          vendor-cool mid-band elite, not just the sub-10% tier).
      - date: "2026-07-26"
        slate: "3M Open at TPC Twin Cities (rules/pga_classic/history/2026-07-26__pga-3m-open-2026)"
        note: >
          Second mechanism confirmation — the scan ran and the
          definer-outside-the-lens streak stayed broken a second straight slate.
          The doc named the top three scores on the slate pre-lock (Koivun 155.0
          tiered Good; Matsuyama 126.5 surfaced as contested chalk; Grillo 118.5
