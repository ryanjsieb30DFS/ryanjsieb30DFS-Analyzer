  # ---- 2026-09-13 — born from the Week 1 autopsy (first logged NFL Classic slate) ----

  - id: nfl_classic_shootout_opposing_qb_not_fade
    born: "2026-09-13"
    origin: "rules/nfl_classic/history/2026-09-13__nfl-classic-week-1-9-13-2026__2"
    statement: >
      When the strategy calls a game a shootout and names the OTHER team's pass-catchers as bring-backs, that team's
      quarterback cannot sit in the Fade tier — his passing points ARE the bring-back's points. Why: a bring-back only
      pays if the opposing QB throws, so a shootout thesis and a Fade on its second QB contradict each other, and the
      cheap low-owned QB is the highest-leverage way to own the same game story. Evidence: the board called CHI@CAR
      up-in-pace with McMillan/Coker as bring-backs, tiered Bryce Young ($5,200, 1.6% proj own) Fade, and Young scored
      35.44 as the 3-Max winner's QB and in 7 of the 20 top-10 lineups; Jalen Coker ($4,600, 36.8) was the slate's
      definer in 60%+ of top lineups. Counts as confirmed when: on a logged slate, a Fade-tiered QB from a game the
      strategy called a shootout finishes top-5 at QB while his catchers were named as bring-backs.
