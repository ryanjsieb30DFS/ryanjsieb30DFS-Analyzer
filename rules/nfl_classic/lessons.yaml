    statement: >
      Fading the obvious bring-back beats keeping him only when the fade buys a construction edge (a third Tier-1 RB, a mini-correlation). Why: the fade's leverage alone is small in a stack that is not over-owned; the salary it frees is where the edge lives. Counts as confirmed when: a logged no-bring-back winner or top-10 lineup carries a visibly different construction from the with-bring-back stacks.
    status: hypothesis
    confirmations:
