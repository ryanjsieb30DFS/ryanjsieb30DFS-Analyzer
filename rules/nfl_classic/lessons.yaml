# Lesson ledger — one entry per generalizable lesson. Claude edits during the
# post-autopsy review; the user approves codifications/retirements.
# Lifecycle: hypothesis -> validated -> codified | retired.
# Promotion: 3 mechanism confirmations -> propose codifying into framework.md.
# Retirement: 2 mechanism contradictions -> propose retiring.
# GPP guard: a lost contest is NOT a contradiction; only mechanism failures count.
lessons:
  # ---- 2026-09-12 — seeded from docs/nfl_game_theory.md Part 1 (external winner studies, pre-season) ----

  - id: nfl_classic_double_stack_edge
    born: "2026-09-12"
    origin: "docs/nfl_game_theory.md 1.2 — ETR Milly Maker winner studies (external data, not a logged slate)"
    statement: >
      A QB stacked with two of his own pass-catchers beats a single stack and a naked QB in winning lineups (41% of winners vs 29% of the field; naked QB 6% vs 17%). Why: a monster passing game (4+ TDs) almost never lands in one receiver's hands, so two catchers double the capture of the QB's ceiling. Counts as confirmed when: a logged slate's top-10 lineups carry QB + 2 same-team pass-catchers more often than the field's rate for that slate.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_classic_te_bring_back
    born: "2026-09-12"
    origin: "docs/nfl_game_theory.md 1.2 — ETR winner studies (external data, not a logged slate)"
    statement: >
      A tight end used as the bring-back (the opposing pass-catcher next to a QB stack) appears in winning lineups more often than the field uses it (+34%). Why: tight-end ceilings are touchdown-driven and cluster in the high-scoring games a stack is already betting on. Counts as confirmed when: on a logged slate, top-10 lineups with a QB stack carry an opposing TE at a higher rate than the field.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_classic_rb_chalk_sturdy
    born: "2026-09-12"
    origin: "docs/nfl_game_theory.md 1.4 — 4for4 / FantasyLabs ownership-to-points work (external data, not a logged slate)"
    statement: >
      Running back is the one position where winning lineups are CHALKIER than the field; fading a volume-based chalk RB costs more than it gains. Why: RB ownership predicts RB points (0.55) because touches are the most bankable input in football. Counts as confirmed when: on a logged slate, the top-10 lineups' RB ownership is at or above the field's RB ownership while their QB/DST/TE ownership sits below it.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_classic_dst_chalk_fragile
    born: "2026-09-12"
    origin: "docs/nfl_game_theory.md 1.4 — ownership-to-points correlations (external data, not a logged slate)"
    statement: >
      The highest-owned defense is the most reliably overpriced piece on the slate. Why: DST scoring is the least predictable on the board (ownership predicts DST points at only 0.21), so the field's confidence is not backed by the distribution. Counts as confirmed when: on a logged slate, the top-owned DST finishes outside the top-3 defenses by points while top-10 lineups used a lower-owned DST.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_classic_cheap_qb_leverage
    born: "2026-09-12"
    origin: "docs/nfl_game_theory.md 1.5 — ETR winner salary studies (external data, not a logged slate)"
    statement: >
      Quarterbacks under $6,000 win more often than the field uses them (45% of winners vs 38% field usage). Why: QB scoring is flat relative to price, cheap QBs run low-owned, and the savings buy RB/WR studs. Counts as confirmed when: a logged slate's top-10 lineups carry a sub-$6,000 QB at a higher rate than the field.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_classic_full_cap
    born: "2026-09-12"
    origin: "docs/nfl_game_theory.md 1.5 — ETR salary-left test (external data, not a logged slate)"
    statement: >
      Winning Classic lineups spend the full cap (84% at $49,800+); leaving salary buys no uniqueness edge in this format. Why: with nine slots, uniqueness comes from player choice and stack structure, and every dollar left is projection surrendered. Counts as confirmed when: a logged slate's top-10 lineups average $49,500+ in salary used.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_classic_forced_value_stampede
    born: "2026-09-12"
    origin: "docs/nfl_game_theory.md 1.5 + the 8/30/26 MMA ownership report (stampede chalk +15-30 pts of own)"
    statement: >
      When late news creates a cheap forced-value starter, the field over-rushes the obvious pivot and under-owns the second-order beneficiary (the passing game that inherits the work). Why: everyone's salary math routes through the same cheap player and the same two studs the savings buy. Counts as confirmed when: on a logged slate with a late-news value play, his actual ownership exceeds the last vendor projection by 10+ points while a same-team second-order beneficiary appears in top-10 lineups above his ownership.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  # ---- 2026-09-12 PM — ETR NFL Classic research digest (external, pre-season) ----

  - id: nfl_classic_chalk_bringback_inside_stack
    born: "2026-09-12"
    origin: "ETR research digest 9/12/26 — docs/etr_research/DIGEST_2026-09-12_nfl_classic.md (Leone, When Is a Chalk Bring-Back Worth It: two small-field contests); external data, not a logged slate"
    statement: >
      A chalk pass-catcher from the chalk game scores as a positive inside the stack he correlates with and as a negative outside it. Why: the stack pays his ceiling twice; naked, his ownership is a pure tax. Counts as confirmed when: on a logged slate, the chalk bring-back's top-10 lineups are stack-mates of his QB more often than not, and his naked lineups finish below the field median.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_classic_bringback_fade_needs_a_reason
    born: "2026-09-12"
    origin: "ETR research digest 9/12/26 — docs/etr_research/DIGEST_2026-09-12_nfl_classic.md (Leone, When Is a Chalk Bring-Back Worth It: two small-field contests); external data, not a logged slate"
    statement: >
      Fading the obvious bring-back beats keeping him only when the fade buys a construction edge (a third Tier-1 RB, a mini-correlation). Why: the fade's leverage alone is small in a stack that is not over-owned; the salary it frees is where the edge lives. Counts as confirmed when: a logged no-bring-back winner or top-10 lineup carries a visibly different construction from the with-bring-back stacks.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_classic_positive_sim_wins_more
    born: "2026-09-12"
    origin: "ETR research digest 9/12/26 — docs/etr_research/DIGEST_2026-09-12_nfl_classic.md (Leone, Putting the Sims to the Test: 35 Game Changer SE contests); external data, not a logged slate"
    statement: >
      The user's entered lineup sims positive on Top 1% / Win% at lock more often when it finishes top 10 than when it does not. Why: ETR measured 1.65x / 0.57x on a same-size SE field. Counts as confirmed when: the picker check in the autopsy shows the top-10 finisher was positive-sim in 6 or more of the first 10 logged slates.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_classic_ownership_miss_three_checks
    born: "2026-09-12"
    origin: "ETR research digest 9/12/26 — docs/etr_research/DIGEST_2026-09-12_nfl_classic.md (Leone, Putting the Sims to the Test: 35 Game Changer SE contests); external data, not a logged slate"
    statement: >
      A lineup that misses on all three ownership checks (correlated pieces up, chalk combo count up, differentiation piece up) finishes below a lineup that passes all three, at equal pre-lock sim. Why: the real field is tougher than the projected one by about 20 points of ROI and the miss concentrates in exactly these three places. Counts as confirmed when: the Sim's vendor_calibration ownership deltas for the entered lineup's stack, combo and low-own piece predict its percentile direction on 4 or more of 6 logged slates.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_classic_dome_stack_tiebreaker
    born: "2026-09-12"
    origin: "ETR research digest 9/12/26 — docs/etr_research/DIGEST_2026-09-12_nfl_classic.md (Brott, Top NFL Narratives, 2021-23 data); external data, not a logged slate"
    statement: >
      Between two equal game environments, the dome game's stack outscores the outdoor one and the dome DST underscores. Why: +12% QB / -15% DST DK points in domes historically. Counts as confirmed when: logged slates show the dome-game stack's actual points above projection more often than the outdoor comparison's.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_classic_dst_pressure_not_points_allowed
    born: "2026-09-12"
    origin: "ETR research digest 9/12/26 (Week 1 columns) — docs/etr_research/DIGEST_2026-09-12_nfl_classic_week1_columns.md (Thorn, OL vs DL Mismatches); external data, not a logged slate"
    statement: >
      A DST attached to a top-6 pass-rush mismatch outscores a DST picked for opponent points allowed. Why: only 2.5% of games are shutouts and 9.7% hold a team to six or fewer, so DST points come from sacks and turnovers, which come from QB pressure. Counts as confirmed when: over 6 logged slates, mismatch-backed DSTs beat their projection more often than points-allowed picks.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_classic_week1_ownership_premium
    born: "2026-09-12"
    origin: "ETR research digest 9/12/26 (Week 1 columns) — docs/etr_research/DIGEST_2026-09-12_nfl_classic_week1_columns.md (Brott, GPP Leverage Week 1 (Milly + Spy)); external data, not a logged slate"
    statement: >
      In Week 1 the higher-owned of two matched twins (same position, price within $500, projection within one point) hits 25 DK points more often than later in the season, relative to the lower-owned twin. Why: the field's Week 1 preference has historically carried real information; the ceiling gap narrows later while the ownership gap stays. Counts as confirmed when: the user's Week 1 autopsies (this season and next) show the chalk twin outscoring the leverage twin at a higher rate than mid-season autopsies do.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_classic_one_game_cap_by_field
    born: "2026-09-12"
    origin: "ETR research digest 9/12/26 (Week 1 columns) — docs/etr_research/DIGEST_2026-09-12_nfl_classic_week1_columns.md (Dinkmeyer, Establish The Million Week 1); external data, not a logged slate"
    statement: >
      Six players from one game in a small field produces measurable duplication; five is the large-field ceiling. Why: the same game's obvious pieces funnel every builder into the same roster. Counts as confirmed when: the Sim's dupe report or the standings show a 6-from-one-game lineup duplicated in a small field on 3 slates.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_classic_three_rb_underowned
    born: "2026-09-12"
    origin: "ETR research digest 9/12/26 (Week 1 columns) — docs/etr_research/DIGEST_2026-09-12_nfl_classic_week1_columns.md (Leone, Establish The Million Week 1); external data, not a logged slate"
    statement: >
      Three-RB builds appear in top lineups more often than in the field and run under-owned. Why: RB is the sturdy-chalk position and the FLEX RB is the winning FLEX; the field still defaults to a WR FLEX. Counts as confirmed when: the stack-centric autopsy shows a 3-RB slot mix over-represented among winners on 4 of 6 slates.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_classic_fangio_tree_volume_drag
    born: "2026-09-12"
    origin: "ETR research digest 9/12/26 (Week 1 columns) — docs/etr_research/DIGEST_2026-09-12_nfl_classic_week1_columns.md (Thorman, Snaps and Pace Week 1); external data, not a logged slate"
    statement: >
      A game with a Fangio-tree defensive coordinator finishes bottom-half in combined plays, so a stack there needs a volume discount. Why: Fangio's eight DC seasons ranked 32nd to 14th in combined offensive plays. Counts as confirmed when: logged slates with such a game show its total plays below the slate median 4 of 6 times.
    status: hypothesis
    confirmations: []
    contradictions: []
    codified_in: null
