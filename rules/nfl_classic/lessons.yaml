      A chalk pass-catcher from the chalk game scores as a positive inside the stack he correlates with and as a negative outside it. Why: the stack pays his ceiling twice; naked, his ownership is a pure tax. Counts as confirmed when: on a logged slate, the chalk bring-back's top-10 lineups are stack-mates of his QB more often than not, and his naked lineups finish below the field median.
