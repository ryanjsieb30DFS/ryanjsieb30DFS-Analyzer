# Lesson ledger — one entry per generalizable lesson. Claude edits during the
# post-autopsy review; the user approves codifications/retirements.
# Lifecycle: hypothesis -> validated -> codified | retired.
# Promotion: 3 mechanism confirmations -> propose codifying into framework.md.
# Retirement: 2 mechanism contradictions -> propose retiring.
# GPP guard: a lost contest is NOT a contradiction; only mechanism failures count.
lessons:
  # ---- 2026-09-12 — seeded from docs/nfl_game_theory.md Part 1 (external winner studies, pre-season) ----

  - id: nfl_classic_double_stack_edge
    born: "2026-09-12"
    origin: "docs/nfl_game_theory.md 1.2 — ETR Milly Maker winner studies (external data, not a logged slate)"
    statement: >
      A QB stacked with two of his own pass-catchers beats a single stack and a naked QB in winning lineups (41% of winners vs 29% of the field; naked QB 6% vs 17%). Why: a monster passing game (4+ TDs) almost never lands in one receiver's hands, so two catchers double the capture of the QB's ceiling. Counts as confirmed when: a logged slate's top-10 lineups carry QB + 2 same-team pass-catchers more often than the field's rate for that slate.
    status: validated
    confirmations:
      - date: "2026-09-13"
        history_dir: "rules/nfl_classic/history/2026-09-13__nfl-classic-week-1-9-13-2026__2"
        note: >
          10 of the 20 top-10 lineups across the SE (2,450) and 3-Max (1,960) carried QB + 2 same-team catchers
          (Young+McMillan+Coker x4, Shough+Olave+Juwan Johnson x4, Shough+Olave+Vele, Kyler stacks) — 50% vs the
          29% external field baseline. This slate's own field rate was not measured; soft confirmation.
    contradictions:
      - date: "2026-09-26"
        history_dir: "rules/nfl_classic/history/2026-09-26__nfl-classic-week-2-9-20-2026"
        note: >
          First slate with the field rate measured: the top 1% (16 lineups) ran a double stack 37.5% of the time
          against 47.5% for the whole field, and a single stack 50% vs 42.1%. The winner (abbyml, 205.28) was
          Purdy + McCaffrey + Kittle. The user ran a double stack in 3 of 3 while the 9 tracked-pro entries ran
          22.2%. The mechanism (two catchers double the capture of a big passing game) did not show up in winners.
    codified_in: null
    retired_reason: null

  - id: nfl_classic_te_bring_back
    born: "2026-09-12"
    origin: "docs/nfl_game_theory.md 1.2 — ETR winner studies (external data, not a logged slate)"
    statement: >
      A tight end used as the bring-back (the opposing pass-catcher next to a QB stack) appears in winning lineups more often than the field uses it (+34%). Why: tight-end ceilings are touchdown-driven and cluster in the high-scoring games a stack is already betting on. Counts as confirmed when: on a logged slate, top-10 lineups with a QB stack carry an opposing TE at a higher rate than the field.
    status: hypothesis
    confirmations: []
    contradictions:
      - date: "2026-09-26"
        history_dir: "rules/nfl_classic/history/2026-09-26__nfl-classic-week-2-9-20-2026"
        note: >
          Soft. 0 of the top-10 lineups carried a tight end from the QB's opponent. The tight ends that paid were
          stack-mates or stand-alones: Kittle ($4,600, 18.0) inside the winner's Purdy stack, Schultz ($3,200, 29.0)
          as a stand-alone in 8 of 10. Field rate of TE bring-backs not measured.
    codified_in: null
    retired_reason: null

  - id: nfl_classic_rb_chalk_sturdy
    born: "2026-09-12"
    origin: "docs/nfl_game_theory.md 1.4 — 4for4 / FantasyLabs ownership-to-points work (external data, not a logged slate)"
    statement: >
      Running back is the one position where winning lineups are CHALKIER than the field; fading a volume-based chalk RB costs more than it gains. Why: RB ownership predicts RB points (0.55) because touches are the most bankable input in football. Counts as confirmed when: on a logged slate, the top-10 lineups' RB ownership is at or above the field's RB ownership while their QB/DST/TE ownership sits below it.
    status: validated
    confirmations:
      - date: "2026-09-13"
        history_dir: "rules/nfl_classic/history/2026-09-13__nfl-classic-week-1-9-13-2026__2"
        note: >
          Jahmyr Gibbs ($8,000, 57-61% owned, 37.6 pts) sat in 17 of the 20 top-10 lineups — above his field rate.
          The other chalk anchors ran BELOW field in the top 10: Michael Mayer (TE, 47-51%, 9.2) in 8 of 20,
          Ja'Marr Chase (WR, 38%, 3.2) in 1 of 20, Jets DST (20%, 9.0) in 4 of 20. RB chalk held; every other
          position's chalk was where the losing half lived.
    contradictions:
      - date: "2026-09-26"
        history_dir: "rules/nfl_classic/history/2026-09-26__nfl-classic-week-2-9-20-2026"
        note: >
          Partial. The sturdiest volume chalk, Bijan Robinson ($8,200, 52.7% owned, 24.0 projected), scored 11.1 and
          sat in 1 of the top 10 (54.7% of the bottom half, 12.5% of the top 1%). Javonte Williams (28.1%, 8.0) sat
          in 0 of 10. The second-tier RB chalk held: Aaron Jones (32.6%, 13.5) in 6 of 10, McCaffrey (26.6%, 22.6)
          in 6 of 10, Henry (34.6%, 17.7) in 4 of 10. Touches did not bank points for the top-owned RB this slate,
          and the chalk TE (Schultz, 37.3%) was in 8 of 10 winners, so the "RB chalkier, TE below" split also failed.
    codified_in: null
    retired_reason: null

  - id: nfl_classic_dst_chalk_fragile
    born: "2026-09-12"
    origin: "docs/nfl_game_theory.md 1.4 — ownership-to-points correlations (external data, not a logged slate)"
    statement: >
      The highest-owned defense is the most reliably overpriced piece on the slate. Why: DST scoring is the least predictable on the board (ownership predicts DST points at only 0.21), so the field's confidence is not backed by the distribution. Counts as confirmed when: on a logged slate, the top-owned DST finishes outside the top-3 defenses by points while top-10 lineups used a lower-owned DST.
    status: validated
    confirmations:
      - date: "2026-09-26"
        history_dir: "rules/nfl_classic/history/2026-09-26__nfl-classic-week-2-9-20-2026"
        note: >
          The top-owned defense, the Buccaneers ($3,600, 15.6% of the field), scored 2.0 and sat in 0 of the top 16
          (19.7% of the bottom half). The top-10 lineups used the Panthers ($2,700, 6.25% owned, 26.0 — the slate's
          top defense) in 5 of 10 and the Patriots / Broncos / Jets / Steelers in the rest. The user's 1/3 carried the
          Buccaneers (a late swap from the Seahawks) and finished top 72.3%.
    contradictions: []
    codified_in: null
    retired_reason: null

  - id: nfl_classic_cheap_qb_leverage
    born: "2026-09-12"
    origin: "docs/nfl_game_theory.md 1.5 — ETR winner salary studies (external data, not a logged slate)"
    statement: >
      Quarterbacks under $6,000 win more often than the field uses them (45% of winners vs 38% field usage). Why: QB scoring is flat relative to price, cheap QBs run low-owned, and the savings buy RB/WR studs. Counts as confirmed when: a logged slate's top-10 lineups carry a sub-$6,000 QB at a higher rate than the field.
    status: validated
    confirmations:
      - date: "2026-09-13"
        history_dir: "rules/nfl_classic/history/2026-09-13__nfl-classic-week-1-9-13-2026__2"
        note: >
          15 of the 20 top-10 lineups ran a sub-$6,000 QB: Bryce Young $5,200 (35.44) x7, Tyler Shough $5,600
          (29.2) x5, Kyler Murray $5,500 x2, Malik Willis x1. The field's four most-owned QBs were all $6,000+
          (Goff, Burrow, Herbert, Lamar at 7-12% each) and only Lamar (28.96) paid.
    contradictions:
      - date: "2026-09-26"
        history_dir: "rules/nfl_classic/history/2026-09-26__nfl-classic-week-2-9-20-2026"
        note: >
          1 of the top-10 lineups ran a sub-$6,000 QB (Drew Lock $4,900, 21.4, rank 7). The other nine ran Dak
          Prescott $6,400 (29.76) x5 and Brock Purdy $6,200 (28.48) x4 — the two top projected QBs in the two best
          games. The cheap tier busted: Lawrence $5,800 7.16, Wentz $4,600 6.3, Nix $5,700 not in any top-10 lineup.
          The mechanism (flat QB scoring vs price) failed when the mid-priced QBs owned the slate's two shootouts.
    codified_in: null
    retired_reason: null

  - id: nfl_classic_full_cap
    born: "2026-09-12"
    origin: "docs/nfl_game_theory.md 1.5 — ETR salary-left test (external data, not a logged slate)"
    statement: >
      Winning Classic lineups spend the full cap (84% at $49,800+); leaving salary buys no uniqueness edge in this format. Why: with nine slots, uniqueness comes from player choice and stack structure, and every dollar left is projection surrendered. Counts as confirmed when: a logged slate's top-10 lineups average $49,500+ in salary used.
    status: codified
    confirmations:
      - date: "2026-09-13"
        history_dir: "rules/nfl_classic/history/2026-09-13__nfl-classic-week-1-9-13-2026__2"
        note: >
          SE top-24 averaged $49,833 used; 3-Max top-20 averaged $49,905. All 40 top lineups were unique.
          The user's four entries averaged $49,925 — this rule was followed.
      - date: "2026-09-26"
        history_dir: "rules/nfl_classic/history/2026-09-26__nfl-classic-week-2-9-20-2026"
        note: >
          3-Max top-20 averaged $49,880 used; the winner (abbyml) spent $50,000 exactly and all 20 were unique.
          The user's three entries averaged $49,933. Third confirming slate — codification proposed.
    contradictions: []
    codified_in: "framework.md — Roster construction / Salary (codified 2026-09-26, 3 confirming slates)"
    retired_reason: null

  - id: nfl_classic_forced_value_stampede
    born: "2026-09-12"
    origin: "docs/nfl_game_theory.md 1.5 + the 8/30/26 MMA ownership report (stampede chalk +15-30 pts of own)"
    statement: >
      When late news creates a cheap forced-value starter, the field over-rushes the obvious pivot and under-owns the second-order beneficiary (the passing game that inherits the work). Why: everyone's salary math routes through the same cheap player and the same two studs the savings buy. Counts as confirmed when: on a logged slate with a late-news value play, his actual ownership exceeds the last vendor projection by 10+ points while a same-team second-order beneficiary appears in top-10 lineups above his ownership.
    status: hypothesis
    confirmations: []
    contradictions:
      - date: "2026-09-26"
        history_dir: "rules/nfl_classic/history/2026-09-26__nfl-classic-week-2-9-20-2026"
        note: >
          Two forced-value plays, neither stampeded and both paid or held: Dalton Schultz ($3,200, Collins out) went
          31.7% projected to 37.3% actual (+5.6, under the 10-point bar) and scored 29.0 in 8 of the top 10; Aaron
          Jones ($5,100, Mason on IR) went 28.7% to 32.6% and scored 13.5 in 6 of 10. No second-order Houston or
          Minnesota beneficiary reached a top-10 lineup. The over-rush did not happen when the news was days old.
    codified_in: null
    retired_reason: null

