    statement: >
      Between two equal game environments, the dome game's stack outscores the outdoor one and the dome DST underscores. Why: +12% QB / -15% DST DK points in domes historically. Counts as confirmed when: logged slates show the dome-game stack's actual points above projection more often than the outdoor comparison's.
    status: codified
    confirmations:
      - date: "2026-09-13"
        history_dir: "rules/nfl_classic/history/2026-09-13__nfl-classic-week-1-9-13-2026__2"
        note: >
          Stack half only. The strategy's two top games were NO@DET (dome, 49.5) and TB@CIN (outdoors, rain chance,
          50.5). The dome stack beat projection across the board — Shough 29.2 vs 18.5, Olave 31.2 vs 18.2,
          St. Brown 28.7 vs 20.5 — while the outdoor stack missed: Burrow 15.2 vs 21.8, Chase 3.2 vs 22.1,
          Higgins 8.9. DST half not checked (Bengals DST score not archived).
      - date: "2026-09-26"
        history_dir: "rules/nfl_classic/history/2026-09-26__nfl-classic-week-2-9-20-2026"
        note: >
          Stack half, soft. The dome game WAS@DAL vs the outdoor MIA@SF (both top-2 by total and game score). Dome:
          Dak 29.76 vs 21.7 projected (+8.1), Lamb 38.3 vs 18.8 (+19.5). Outdoor: Purdy 28.48 vs 21.1 (+7.4), Kittle
          18.0 vs 11.3 (+6.7), McCaffrey 22.6 vs 21.4 (+1.2). Both stacks beat projection; the dome stack beat it by
          more. DST half again not checked (Cowboys / Commanders DST scores not archived). Third confirming slate.
    contradictions: []
    codified_in: "framework.md — Pick the game / Dome tiebreaker (codified 2026-09-26, stack half only; dome-DST discount unmeasured)"
