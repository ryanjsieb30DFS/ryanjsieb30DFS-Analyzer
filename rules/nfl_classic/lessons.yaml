          salary on two $6,800+ receivers from other games: Lamb ($7,300, 38.3) and DeVonta Smith ($6,800, 30.7).
          The user's Purdy entry carried two Miami bring-backs (Malik Washington, Caleb Douglas 3.9) and finished
