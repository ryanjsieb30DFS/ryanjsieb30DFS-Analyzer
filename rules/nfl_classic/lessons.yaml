    statement: >
      A DST attached to a top-6 pass-rush mismatch outscores a DST picked for opponent points allowed. Why: only 2.5% of games are shutouts and 9.7% hold a team to six or fewer, so DST points come from sacks and turnovers, which come from QB pressure. Counts as confirmed when: over 6 logged slates, mismatch-backed DSTs beat their projection more often than points-allowed picks.
    status: hypothesis
    confirmations: []
    contradictions:
      - date: "2026-09-26"
        history_dir: "rules/nfl_classic/history/2026-09-26__nfl-classic-week-2-9-20-2026"
